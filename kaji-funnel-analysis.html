<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家事（全体）ファネル分析</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:    #fcfcfb;
    --surface-2:    #f9f9f7;
    --surface-card: #ffffff;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:      #e1e0d9;
    --baseline:  #c3c2b7;
    --border:    rgba(11,11,11,0.10);

    --s0: #898781; /* neutral (計) */
    --sp: #4a3aa7; /* violet (unused here) */
    --sl: #e87ba4; /* magenta (unused here) */
    --s1: #2a78d6; /* blue (請求) */
    --s2: #eb6834; /* orange (被請求) */
    --s3: #1baf7a; /* aqua (離婚) */

    --good:     #0ca30c;
    --warning:  #fab219;
    --critical: #d03b3b;

    --lane-bg: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1:    #1a1a19;
      --surface-2:    #0d0d0d;
      --surface-card: #232322;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:      #2c2c2a;
      --baseline:  #383835;
      --border:    rgba(255,255,255,0.10);

      --s0: #898781;
      --sp: #9085e9;
      --sl: #d55181;
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;

      --lane-bg: #2c2c2a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:    #1a1a19;
    --surface-2:    #0d0d0d;
    --surface-card: #232322;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:      #2c2c2a;
    --baseline:  #383835;
    --border:    rgba(255,255,255,0.10);

    --s0: #898781;
    --sp: #9085e9;
    --sl: #d55181;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;

    --lane-bg: #2c2c2a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-2);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
    padding-bottom: 64px;
  }

  header.top {
    background: var(--surface-card);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header.top h1 { font-size: 1.25rem; font-weight: 700; margin: 0 0 4px; }
  header.top p { margin: 0 0 12px; font-size: .82rem; color: var(--text-muted); }
  .badge-demo {
    display: inline-block; font-size: .68rem; font-weight: 700; color: var(--s1);
    border: 1px solid var(--s1); border-radius: 20px; padding: 1px 10px; margin-left: 8px; vertical-align: middle;
  }

  .month-picker { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .month-picker .mp-label { font-size: .76rem; font-weight: 700; color: var(--text-muted); }
  .month-btn {
    font-family: inherit; font-size: .8rem; font-weight: 700; padding: 6px 14px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary); cursor: pointer;
  }
  .month-btn[aria-pressed="true"] { background: var(--s1); border-color: var(--s1); color: #fff; }
  .month-btn--note { border-style: dashed; }
  .month-btn--note[aria-pressed="true"] { background: var(--warning); border-color: var(--warning); }

  main { max-width: 1100px; margin: 0 auto; padding: 24px; }

  section.card {
    background: var(--surface-card); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px 22px; margin-bottom: 20px;
  }
  section.card h2 { font-size: .98rem; font-weight: 700; margin: 0 0 4px; }
  section.card .card-sub { font-size: .78rem; color: var(--text-muted); margin: 0 0 16px; }

  .sub-head { font-size: .78rem; font-weight: 700; color: var(--text-muted); margin: 22px 0 10px; }
  .sub-head:first-of-type { margin-top: 0; }
  .sub-note { font-size: .74rem; color: var(--text-muted); margin: -6px 0 12px; }
  .period-note { font-size: .78rem; color: var(--warning); font-weight: 700; margin: 0 0 16px; }

  /* ---- KPI tiles ---- */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 12px; margin-bottom: 4px; }
  .kpi-tile { border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .kpi-tile .kpi-label { font-size: .76rem; color: var(--text-muted); margin-bottom: 6px; }
  .kpi-tile .kpi-value { font-size: 1.3rem; font-weight: 700; line-height: 1.25; white-space: nowrap; }
  .kpi-tile .kpi-unit { font-size: .82rem; font-weight: 400; color: var(--text-secondary); margin-left: 2px; }
  .kpi-tile.hero .kpi-value { color: var(--s1); }

  /* ---- entity toggle ---- */
  .agency-toggle { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .agency-btn {
    font-family: inherit; font-size: .82rem; font-weight: 700; padding: 8px 14px; border-radius: 20px;
    border: 1.5px solid var(--border); background: var(--surface-1); color: var(--text-secondary); cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .agency-btn .swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .agency-btn.all-btn { border-style: dashed; }
  .agency-btn.all-btn .swatch { border-radius: 2px; }
  .agency-btn .cnt { font-variant-numeric: tabular-nums; color: var(--text-muted); }
  .agency-btn[aria-pressed="true"] { border-color: currentColor; border-style: solid; background: var(--surface-card); color: var(--text-primary); box-shadow: 0 0 0 1px currentColor inset; }

  /* ---- roas-style mini tiles ---- */
  .roas-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 14px 0 4px; }
  .roas-tile { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; background: var(--surface-1); }
  .roas-tile .roas-label { font-size: .72rem; color: var(--text-muted); margin-bottom: 4px; }
  .roas-tile .roas-value { font-size: 1.3rem; font-weight: 700; }
  .roas-tile .roas-note { font-size: .7rem; color: var(--text-muted); margin-top: 2px; }

  /* ---- breakdown bars (funnel) ---- */
  .grp { margin-bottom: 18px; }
  .grp:last-child { margin-bottom: 0; }
  .grp-head { display: flex; justify-content: space-between; align-items: baseline; font-size: .82rem; font-weight: 700; color: var(--text-secondary); border-bottom: 1px solid var(--grid); padding-bottom: 6px; margin-bottom: 10px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-cat { width: 110px; flex-shrink: 0; font-size: .8rem; color: var(--text-primary); font-weight: 700; }
  .bar-lane { flex: 1; height: 20px; background: var(--lane-bg); border-radius: 4px; position: relative; }
  .bar-fill { height: 100%; border-radius: 0 4px 4px 0; }
  .bar-figs { width: 220px; flex-shrink: 0; text-align: right; font-size: .78rem; font-variant-numeric: tabular-nums; color: var(--text-secondary); }
  .bar-figs strong { color: var(--text-primary); font-weight: 700; }

  /* ---- tables ---- */
  .table-toggle { font-family: inherit; font-size: .8rem; font-weight: 700; color: var(--s1); background: none; border: none; cursor: pointer; padding: 0; margin-top: 18px; }
  .table-block { overflow-x: auto; margin-top: 16px; }
  .table-block h3 { font-size: .82rem; font-weight: 700; margin: 0 0 8px; }
  .table-block p.note { font-size: .72rem; color: var(--text-muted); margin: 6px 0 0; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: .78rem; }
  table.data-table th, table.data-table td { padding: 7px 9px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.data-table th:first-child, table.data-table td:first-child { text-align: left; font-variant-numeric: normal; }
  table.data-table thead th { color: var(--text-muted); font-weight: 700; border-bottom: 1px solid var(--baseline); }
  table.data-table tbody tr.total-row td { font-weight: 700; border-top: 1px solid var(--baseline); border-bottom: none; background: var(--surface-1); }
  table.data-table td.na { color: var(--text-muted); }

  @media (max-width: 640px) {
    .bar-cat { width: 76px; font-size: .74rem; }
    .bar-figs { width: 160px; }
  }
</style>
</head>
<body>

<header class="top">
  <h1>家事（全体）　ファネル分析<span class="badge-demo">実績データ・草案</span></h1>
  <p>流入→予約→面談→即受任→総受任→契約の各段階を、請求／被請求／離婚の内訳つきで分析。元データ（Excel）に基づく実績値です。</p>
  <div class="month-picker">
    <span class="mp-label">対象期間</span>
    <div id="period-buttons" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
  </div>
</header>

<main>

  <section class="card">
    <p class="period-note" id="period-note" hidden></p>
    <h2>全体サマリー（計）</h2>
    <p class="card-sub">選択した期間の、区分計（請求＋被請求＋離婚＋その他）の実績。</p>
    <div class="kpi-row" id="kpi-row"></div>
  </section>

  <section class="card">
    <div class="sub-head">表示切替（計／請求／被請求／離婚）</div>
    <p class="sub-note">選択した区分のファネル推移（予約→面談→即受任→総受任）と契約実績が下に表示されます。</p>
    <div class="agency-toggle" id="entity-toggle"></div>
    <div id="funnel-bars"></div>
    <div id="contract-row"></div>
    <button class="table-toggle" id="table-toggle">＋ 全区分クロス集計を表示（細分類を含む）</button>
    <div id="tables" hidden></div>
  </section>

</main>

<script>
const SUBTYPES_ALL = ['請求','チャレンジ','被請求','貞操権','離婚','バックアップ','婚費','養育費','サポート','計'];
const SUBTYPES_SECONDARY = ['チャレンジ','貞操権','バックアップ','婚費','養育費','サポート'];

const ENTITIES = [
  { key: '計', label: '計', color: 'var(--s0)', dashed: true },
  { key: '請求', label: '請求', color: 'var(--s1)', dashed: false },
  { key: '被請求', label: '被請求', color: 'var(--s2)', dashed: false },
  { key: '離婚', label: '離婚', color: 'var(--s3)', dashed: false },
];

const PERIODS = [
  { key: '7月', label: '2026年7月', note: false },
  { key: '8月', label: '2026年8月', note: false },
  { key: '9月', label: '2026年9月', note: false },
  { key: '10月', label: '2026年10月', note: false },
  { key: '11月', label: '2026年11月（10日比例着地）', note: true,
    noteText: '※2026年11月度は、月初10日間の実績を按分した「10日比例着地」による着地予測値です（確定実績ではありません）。' },
  { key: '請求受任率９月モデル', label: '請求受任率９月モデル', note: true,
    noteText: '※「請求受任率９月モデル」は、請求区分の受任率を9月実績モデルに基づいて試算したシナリオ値です（確定実績ではありません）。' },
  { key: '被請求受任率９月モデル', label: '被請求受任率９月モデル', note: true,
    noteText: '※「被請求受任率９月モデル」は、被請求区分の受任率を9月実績モデルに基づいて試算したシナリオ値です（確定実績ではありません）。' },
];

let selectedPeriod = '10月';
let activeEntity = '計';

const fmt = n => (n === null || n === undefined) ? '—' : Math.round(n).toLocaleString('ja-JP');
const pct = n => (n === null || n === undefined || isNaN(n)) ? '—' : (n * 100).toFixed(1) + '%';
const fmtYen = n => (n === null || n === undefined) ? '—' : fmt(n) + '円';

function renderPeriodButtons() {
  const el = document.getElementById('period-buttons');
  el.innerHTML = '';
  PERIODS.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'month-btn' + (p.note ? ' month-btn--note' : '');
    btn.textContent = p.label;
    btn.setAttribute('aria-pressed', p.key === selectedPeriod ? 'true' : 'false');
    btn.addEventListener('click', () => { selectedPeriod = p.key; renderAll(); });
    el.appendChild(btn);
  });
}

function currentData() { return FUNNEL_DATA[selectedPeriod]; }

function renderPeriodNote() {
  const p = PERIODS.find(p => p.key === selectedPeriod);
  const el = document.getElementById('period-note');
  if (p.note) {
    el.hidden = false;
    el.textContent = p.noteText;
  } else {
    el.hidden = true;
  }
}

function renderKpi() {
  const d = currentData();
  const total = d['総受任']['計'].総受任数;
  const contract = d['契約']['計'];
  const tiles = [
    ['流入数', fmt(d['流入数']), false],
    ['予約（計）', fmt(d['予約']['計'].件数), false],
    ['面談（計）', fmt(d['面談']['計'].件数), false],
    ['総受任数（計）', fmt(total), true],
    ['契約（計）', fmt(contract.件数), false],
    ['契約金額（計）', fmtYen(contract.金額), false],
  ];
  document.getElementById('kpi-row').innerHTML = tiles.map(t => {
    const [label, value, hero] = t;
    return `<div class="kpi-tile${hero ? ' hero' : ''}"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div></div>`;
  }).join('');
}

function renderEntityToggle() {
  const d = currentData();
  const el = document.getElementById('entity-toggle');
  el.innerHTML = '';
  ENTITIES.forEach(ent => {
    const btn = document.createElement('button');
    btn.className = 'agency-btn' + (ent.dashed ? ' all-btn' : '');
    btn.style.color = ent.color;
    btn.setAttribute('aria-pressed', ent.key === activeEntity ? 'true' : 'false');
    const cnt = d['総受任'][ent.key] ? d['総受任'][ent.key].総受任数 : null;
    btn.innerHTML = `<span class="swatch" style="background:${ent.color}"></span>${ent.label}<span class="cnt">${fmt(cnt)}件</span>`;
    btn.addEventListener('click', () => { activeEntity = ent.key; renderEntityToggle(); renderFunnel(); renderContract(); });
    el.appendChild(btn);
  });
}

function renderFunnel() {
  const d = currentData();
  const ent = ENTITIES.find(e => e.key === activeEntity);
  const reserve = d['予約'][activeEntity];
  const meeting = d['面談'][activeEntity];
  const immediate = d['即受任'][activeEntity];
  const totalAcc = d['総受任'][activeEntity];
  const maxVal = reserve && reserve.件数 ? reserve.件数 : 1;

  const rows = [
    { label: '予約', value: reserve ? reserve.件数 : null,
      figs: reserve ? `<strong>${fmt(reserve.件数)}</strong>件（流入対率 ${pct(reserve.流入対率)}）` : '—' },
    { label: '面談', value: meeting.件数,
      figs: `<strong>${fmt(meeting.件数)}</strong>件（実施率 ${pct(meeting.実施率)}）` },
    { label: '即受任', value: immediate.件数,
      figs: `<strong>${fmt(immediate.件数)}</strong>件（即受任率 ${pct(immediate.即受任率)}）` },
    { label: '総受任', value: totalAcc.総受任数,
      figs: `<strong>${fmt(totalAcc.総受任数)}</strong>件（総受任率 ${pct(totalAcc.総受任率)}）` },
  ];

  document.getElementById('funnel-bars').innerHTML = `
    <div class="grp">
      <div class="grp-head"><span>ファネル推移（${ent.label}）</span></div>
      ${rows.map(r => {
        const v = r.value || 0;
        const w = maxVal ? Math.max(0, v) / maxVal * 100 : 0;
        return `
          <div class="bar-row">
            <div class="bar-cat">${r.label}</div>
            <div class="bar-lane"><div class="bar-fill" style="width:${w}%;background:${ent.color}"></div></div>
            <div class="bar-figs">${r.figs}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderContract() {
  const d = currentData();
  const ent = ENTITIES.find(e => e.key === activeEntity);
  const c = d['契約'][activeEntity];
  document.getElementById('contract-row').innerHTML = `
    <div class="roas-row">
      <div class="roas-tile"><div class="roas-label">契約件数（${ent.label}）</div><div class="roas-value" style="color:${ent.color}">${fmt(c.件数)}件</div><div class="roas-note">契約率 ${pct(c.契約率)}（対 総受任数）</div></div>
      <div class="roas-tile"><div class="roas-label">契約金額（${ent.label}）</div><div class="roas-value">${fmtYen(c.金額)}</div></div>
    </div>
  `;
}

function renderCrossTable() {
  const d = currentData();
  const cols = [
    { key: '予約件数', get: st => d['予約'][st] ? d['予約'][st].件数 : null, fmt: fmt },
    { key: '面談件数', get: st => d['面談'][st].件数, fmt: fmt },
    { key: '実施率', get: st => d['面談'][st].実施率, fmt: pct },
    { key: '即受任件数', get: st => d['即受任'][st].件数, fmt: fmt },
    { key: '即受任率', get: st => d['即受任'][st].即受任率, fmt: pct },
    { key: '総受任数', get: st => d['総受任'][st].総受任数, fmt: fmt },
    { key: '総受任率', get: st => d['総受任'][st].総受任率, fmt: pct },
    { key: '契約件数', get: st => d['契約'][st].件数, fmt: fmt },
    { key: '契約率', get: st => d['契約'][st].契約率, fmt: pct },
    { key: '契約金額', get: st => d['契約'][st].金額, fmt: fmtYen },
  ];
  const headCols = cols.map(c => `<th>${c.key}</th>`).join('');
  const mainOrder = ['請求','被請求','離婚','チャレンジ','貞操権','バックアップ','婚費','養育費','サポート'];
  const bodyRows = mainOrder.map(st => {
    const cells = cols.map(c => {
      const v = c.get(st);
      return `<td>${v === null || v === undefined ? '<span class="na">—</span>' : c.fmt(v)}</td>`;
    }).join('');
    return `<tr><td>${st}</td>${cells}</tr>`;
  }).join('');
  const totalCells = cols.map(c => {
    const v = c.get('計');
    return `<td>${v === null || v === undefined ? '<span class="na">—</span>' : c.fmt(v)}</td>`;
  }).join('');
  const totalRow = `<tr class="total-row"><td>計</td>${totalCells}</tr>`;

  document.getElementById('tables').innerHTML = `
    <div class="table-block">
      <h3>区分別クロス集計（${PERIODS.find(p => p.key === selectedPeriod).label}）</h3>
      <table class="data-table">
        <thead><tr><th>区分</th>${headCols}</tr></thead>
        <tbody>${bodyRows}${totalRow}</tbody>
      </table>
      <p class="note">予約段階は請求・被請求・離婚・計のみ集計対象です（チャレンジ以下は面談段階から細分類として現れます）。実施率＝面談件数÷予約件数、即受任率＝即受任件数÷面談件数、総受任率＝総受任数÷面談件数、契約率＝契約件数÷総受任数。</p>
    </div>
  `;
}

function renderAll() {
  renderPeriodButtons();
  renderPeriodNote();
  renderKpi();
  renderEntityToggle();
  renderFunnel();
  renderContract();
  renderCrossTable();
}

document.getElementById('table-toggle').addEventListener('click', function () {
  const t = document.getElementById('tables');
  t.hidden = !t.hidden;
  this.textContent = (t.hidden ? '＋ ' : '－ ') + '全区分クロス集計を表示（細分類を含む）';
});

renderAll();
</script>

</body>
</html>
