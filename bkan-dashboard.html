  { key: 'lead', label: 'リード合計実績', color: 'var(--sl)', dashed: true },
  { key: 'ashiro', label: 'アシロ', color: 'var(--s1)', dashed: false },
  { key: 'self', label: 'セルフ', color: 'var(--s2)', dashed: false },
  { key: 'organic', label: 'オーガニック', color: 'var(--s3)', dashed: false },
];

let activeEntity = 'all';

const fmt = n => Math.round(n).toLocaleString('ja-JP');
const pct = n => n.toFixed(1) + '%';
const fmtYen = n => fmt(n) + '円';

function getAllKeys() { return GROUPS.flatMap(g => g.items.map(it => it.key)); }
function currentMonthData() { return MONTH_DATA[MONTHS[selectedMonthIndex].key]; }
function entityTotal(m, key) { return getAllKeys().reduce((s, k) => s + (m.items[k][key] || 0), 0); }

function renderMonthButtons() {
  const el = document.getElementById('month-buttons');
  el.innerHTML = '';
  MONTHS.forEach((mo, i) => {
    const btn = document.createElement('button');
    btn.className = 'month-btn';
    btn.textContent = mo.label;
    btn.setAttribute('aria-pressed', i === selectedMonthIndex ? 'true' : 'false');
    btn.addEventListener('click', () => { selectedMonthIndex = i; renderAll(); });
    el.appendChild(btn);
  });
}

function renderKpis() {
  const m = currentMonthData();
  const all = entityTotal(m, 'all');
  const lead = entityTotal(m, 'lead');
  const occ = all ? (lead / all) * 100 : 0;
  document.getElementById('kpi-row').innerHTML = `
    <div class="kpi-tile">
      <div class="kpi-label">全体実績（全流入経路・受任数）</div>
      <div class="kpi-value">${fmt(all)}<span class="kpi-unit">件</span></div>
    </div>
    <div class="kpi-tile">
      <div class="kpi-label">リード合計実績（受任数）</div>
      <div class="kpi-value">${fmt(lead)}<span class="kpi-unit">件</span></div>
    </div>
    <div class="kpi-tile hero">
      <div class="kpi-label">リード占有率</div>
      <div class="kpi-value">${pct(occ)}</div>
      <div class="kpi-meter"><div class="kpi-meter-fill" style="width:${occ}%"></div></div>
    </div>
  `;
}

function renderEntityToggle() {
  const m = currentMonthData();
  const el = document.getElementById('entity-toggle');
  el.innerHTML = '';
  ENTITIES.forEach(ent => {
    const btn = document.createElement('button');
    btn.className = 'agency-btn' + (ent.dashed ? ' all-btn' : '');
    btn.style.color = ent.color;
    btn.setAttribute('aria-pressed', ent.key === activeEntity ? 'true' : 'false');
    btn.innerHTML = `<span class="swatch" style="background:${ent.color}"></span>${ent.label}<span class="cnt">${fmt(entityTotal(m, ent.key))}件</span>`;
    btn.addEventListener('click', () => { activeEntity = ent.key; renderEntityToggle(); updateCompositionHighlight(); renderRoas(); renderBreakdown(); });
    el.appendChild(btn);
  });
}

function renderComposition() {
  const m = currentMonthData();
  const leadTotal = entityTotal(m, 'lead');
  const subs = [
    { key: 'ashiro', label: 'アシロ', color: 'var(--s1)' },
    { key: 'self', label: 'セルフ', color: 'var(--s2)' },
    { key: 'organic', label: 'オーガニック', color: 'var(--s3)' },
  ];
  const barEl = document.getElementById('comp-bar');
  const legendEl = document.getElementById('comp-legend');
  barEl.innerHTML = '';
  legendEl.innerHTML = '';
  subs.forEach(s => {
    const t = entityTotal(m, s.key);
    const p = leadTotal ? (t / leadTotal) * 100 : 0;
    const seg = document.createElement('div');
    seg.className = 'comp-seg';
    seg.style.width = Math.max(0, p) + '%';
    seg.style.background = s.color;
    seg.title = `${s.label}：${fmt(t)}件（リード内 ${pct(p)}）`;
    seg.dataset.entity = s.key;
    barEl.appendChild(seg);

    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = `<span class="swatch" style="background:${s.color}"></span>${s.label}（${pct(p)}）`;
    legendEl.appendChild(item);
  });
  updateCompositionHighlight();
}

function updateCompositionHighlight() {
  const showAll = activeEntity === 'all' || activeEntity === 'proper' || activeEntity === 'lead';
  document.querySelectorAll('#comp-bar .comp-seg').forEach(seg => {
    seg.style.opacity = (showAll || seg.dataset.entity === activeEntity) ? '1' : '.4';
  });
}

function renderRoas() {
  const m = currentMonthData();
  const el = document.getElementById('roas-row');
  const ent = ENTITIES.find(e => e.key === activeEntity);

  if (activeEntity === 'all' || activeEntity === 'proper') {
    el.innerHTML = `<p class="roas-note-box">広告費・期待収益・ROASは、リージェネ代理店経由（アシロ・セルフ・オーガニック・リード合計実績）のみ表示しています。</p>`;
    return;
  }

  const adSpend = m.adSpend[activeEntity];
  const revenue = m.revenue[activeEntity];

  if (!adSpend) {
    el.innerHTML = `<p class="roas-note-box">${ent.label}は広告費をかけていない流入経路のため、広告費・ROASの算出対象外です（期待収益：<strong>${fmtYen(revenue)}</strong>）。</p>`;
    return;
  }
  const roas = (revenue / adSpend) * 100;
  const roasClass = roas >= 250 ? 'style="color:var(--good)"' : (roas < 150 ? 'style="color:var(--critical)"' : '');
  el.innerHTML = `
    <div class="roas-row">
      <div class="roas-tile">
        <div class="roas-label">広告費</div>
        <div class="roas-value">${fmtYen(adSpend)}</div>
      </div>
      <div class="roas-tile">
        <div class="roas-label">期待収益</div>
        <div class="roas-value">${fmtYen(revenue)}</div>
      </div>
      <div class="roas-tile">
        <div class="roas-label">ROAS（期待収益 ÷ 広告費）</div>
        <div class="roas-value" ${roasClass}>${pct(roas)}</div>
        <div class="roas-note">目安：250%以上=良好／150%未満=要注意</div>
      </div>
    </div>
  `;
}

function renderBreakdown() {
  const m = currentMonthData();
  const ent = ENTITIES.find(e => e.key === activeEntity);
  const denom = entityTotal(m, activeEntity);
  const maxVal = Math.max(...getAllKeys().map(k => m.items[k][activeEntity] || 0), 1);

  const el = document.getElementById('breakdown');
  el.innerHTML = GROUPS.map(g => {
    const groupTotal = g.items.reduce((a, it) => a + (m.items[it.key][activeEntity] || 0), 0);
    const groupShare = denom ? (groupTotal / denom) * 100 : 0;
    const headHtml = g.name
      ? `<div class="grp-head"><span>${g.name}</span><span class="grp-sub">計 ${fmt(groupTotal)}件（${pct(groupShare)}）</span></div>`
      : '';
    const rows = g.items.map(it => {
      const v = m.items[it.key][activeEntity] || 0;
      const w = (Math.max(0, v) / maxVal) * 100;
      const share = denom ? (v / denom) * 100 : 0;
      return `
        <div class="bar-row">
          <div class="bar-cat">${it.name}</div>
          <div class="bar-lane"><div class="bar-fill" style="width:${w}%;background:${ent.color}"></div></div>
          <div class="bar-figs"><strong>${fmt(v)}</strong>件（${pct(share)}）</div>
        </div>
      `;
    }).join('');
    return `<div class="grp">${headHtml}${rows}</div>`;
  }).join('');
}

function renderTables() {
  const m = currentMonthData();
  const el = document.getElementById('tables');
  const cols = [
    { key: 'ashiro', label: 'アシロ' },
    { key: 'self', label: 'セルフ' },
    { key: 'organic', label: 'オーガニック' },
    { key: 'lead', label: 'リード計' },
    { key: 'proper', label: 'プロパー実績' },
    { key: 'all', label: '全体実績' },
  ];
  const headCols = cols.map(c => `<th>${c.label}</th>`).join('');
  const bodyRows = GROUPS.map(g => {
    const groupHead = g.name
      ? `<tr class="grp-row"><td>${g.name}</td>${cols.map(() => '<td></td>').join('')}</tr>`
      : '';
    const itemRows = g.items.map(it => {
      const cells = cols.map(c => `<td>${fmt(m.items[it.key][c.key] || 0)}</td>`).join('');
      return `<tr><td>${it.name}</td>${cells}</tr>`;
    }).join('');
    return groupHead + itemRows;
  }).join('');
  const totalRow = `
    <tr class="total-row">
      <td>合計</td>
      ${cols.map(c => `<td>${fmt(entityTotal(m, c.key))}</td>`).join('')}
    </tr>
  `;

  const roasEntities = [
    { key: 'lead', label: 'リード合計実績' },
    { key: 'ashiro', label: 'アシロ' },
    { key: 'self', label: 'セルフ' },
    { key: 'organic', label: 'オーガニック' },
  ];
  const roasRows = roasEntities.map(e => {
    const ad = m.adSpend[e.key];
    const rev = m.revenue[e.key];
    if (!ad) {
      return `<tr><td>${e.label}</td><td class="na">広告費なし</td><td>${fmtYen(rev)}</td><td class="na">－</td></tr>`;
    }
    const roas = (rev / ad) * 100;
    const cls = roas >= 250 ? 'roas-good' : (roas < 150 ? 'roas-bad' : '');
    return `<tr><td>${e.label}</td><td>${fmtYen(ad)}</td><td>${fmtYen(rev)}</td><td class="${cls}">${pct(roas)}</td></tr>`;
  }).join('');

  const priceRows = GROUPS.flatMap(g => g.items).map(it =>
    `<tr><td>${it.name}</td><td>${fmtYen(PRICES[it.key])}</td></tr>`
  ).join('');

  el.innerHTML = `
    <div class="table-block">
      <h3>症状 × 流入経路 クロス集計（受任数・${MONTHS[selectedMonthIndex].label}度）</h3>
      <table class="data-table">
        <thead><tr><th>症状</th>${headCols}</tr></thead>
        <tbody>${bodyRows}${totalRow}</tbody>
      </table>
    </div>
    <div class="table-block">
      <h3>流入経路別 広告費・期待収益・ROAS（${MONTHS[selectedMonthIndex].label}度）</h3>
      <table class="data-table">
        <thead><tr><th>流入経路</th><th>広告費</th><th>期待収益</th><th>ROAS</th></tr></thead>
        <tbody>${roasRows}</tbody>
      </table>
      <p class="note">広告費・期待収益・ROASはリージェネ代理店経由（アシロ・セルフ・オーガニック・リード合計実績）のみ掲載しています。数値はご提供データの実績値をそのまま使用しています。</p>
    </div>
    <div class="table-block">
      <h3>症状別 リージェネ単価表（参考）</h3>
      <table class="data-table">
        <thead><tr><th>症状</th><th>単価</th></tr></thead>
        <tbody>${priceRows}</tbody>
      </table>
      <p class="note">※この単価はリージェネ（代理店）経由の受任1件に用いられる単価で、プロパー経由の単価とは異なります。参考情報であり、上表の期待収益は単価表からの逆算値ではなく、ご提供データの実績値を使用しています。</p>
    </div>
  `;
}

function renderAll() {
  renderMonthButtons();
  renderKpis();
  renderEntityToggle();
  renderComposition();
  renderRoas();
  renderBreakdown();
  renderTables();
}

document.getElementById('table-toggle').addEventListener('click', function () {
  const t = document.getElementById('tables');
  t.hidden = !t.hidden;
  this.textContent = (t.hidden ? '＋ ' : '－ ') + '症状別クロス集計・広告費対効果を表示';
});

renderAll();
</script>

</body>
</html>
