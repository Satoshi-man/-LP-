<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM営業部 全ドメイン受付ツール</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1a2b4a;
      --navy-dark: #0f1e35;
      --gold: #c8a951;
      --gold-light: #e8d080;
      --gray-bg: #f5f6f8;
      --text: #2d2d2d;
      --text-light: #666;
      --white: #fff;
      --green: #27ae60;
      --green-light: #eafaf1;
      --red: #c0392b;
      --border: #dde1e8;
      --accent: #1a2b4a;        /* ドメインごとに上書き */
      --accent-light: #eef1f6;  /* ドメインごとに上書き */
    }

    body {
      font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--text);
      line-height: 1.7;
      font-size: 15px;
      background: var(--gray-bg);
      min-height: 100vh;
    }

    /* ─── Header ─── */
    .app-header {
      background: var(--navy);
      color: var(--white);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .app-header h1 { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .app-header .badge {
      background: var(--gold); color: var(--navy);
      font-size: .65rem; font-weight: 800; padding: 2px 8px; border-radius: 3px; letter-spacing: .05em;
    }
    .app-header .internal { font-size: .7rem; color: var(--gold-light); }

    /* ─── Domain tabs ─── */
    .domain-bar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 56px;
      z-index: 90;
    }
    .domain-tabs {
      max-width: 1400px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .domain-btn {
      font-family: inherit;
      font-size: .88rem;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 6px;
      border: 2px solid var(--border);
      background: var(--white);
      color: var(--text);
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .domain-btn:hover { border-color: var(--c); color: var(--c); }
    .domain-btn.active { background: var(--c); border-color: var(--c); color: var(--white); }
    .domain-btn .dot {
      min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px;
      font-size: .65rem; line-height: 18px; text-align: center;
      background: var(--gray-bg); color: var(--text-light);
    }
    .domain-btn.active .dot { background: rgba(255,255,255,.25); color: var(--white); }
    .domain-btn .dot:empty { display: none; }

    /* ─── Layout ─── */
    .app-container {
      display: grid;
      grid-template-columns: 1fr 420px;
      max-width: 1400px;
      margin: 0 auto;
      align-items: start;
    }
    .form-panel { padding: 24px; min-width: 0; }
    .side-panel {
      background: var(--white);
      border-left: 1px solid var(--border);
      padding: 24px;
      position: sticky;
      top: 118px;
      height: calc(100vh - 118px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .domain-title {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 16px;
    }
    .domain-title h2 {
      font-size: 1.15rem; color: var(--accent);
      border-left: 5px solid var(--accent); padding-left: 10px;
    }
    .progress { font-size: .78rem; color: var(--text-light); white-space: nowrap; }
    .progress-bar { width: 140px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .progress-bar span { display: block; height: 100%; background: var(--accent); transition: width .2s; }

    .section-title {
      font-size: .8rem; font-weight: 700; color: var(--text-light);
      letter-spacing: .05em; margin: 20px 0 8px;
    }

    /* ─── Cards ─── */
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }
    .card.answered { border-left: 4px solid var(--accent); }
    .card.branch { margin-left: 24px; border-style: dashed; }
    .card.branch::before {
      content: "↳ 枝分かれ質問"; display: block;
      font-size: .7rem; color: var(--accent); font-weight: 700; margin-bottom: 2px;
    }

    .q-label { font-weight: 700; font-size: .92rem; margin-bottom: 4px; }
    .q-label .num { color: var(--accent); margin-right: 6px; }
    .q-label .type {
      font-size: .65rem; font-weight: 700; color: var(--text-light);
      border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; margin-left: 6px; vertical-align: 2px;
    }
    .q-hint { font-size: .75rem; color: var(--text-light); margin-bottom: 8px; }

    .options { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .opt { position: relative; }
    .opt input { position: absolute; opacity: 0; pointer-events: none; }
    .opt span {
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: .84rem;
      cursor: pointer;
      background: var(--white);
      transition: all .12s;
      user-select: none;
    }
    .opt span:hover { border-color: var(--accent); }
    .opt input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--white); }
    .opt input:checked + span::before { content: "✓ "; }
    .opt input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }

    .text-input, .field input, .field select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: .88rem;
      font-family: inherit;
      background: var(--white);
      color: var(--text);
    }
    .text-input { margin-top: 8px; }
    .text-input:focus, .field input:focus, .field select:focus, textarea:focus {
      outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200,169,81,.15);
    }

    .grid-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 14px; }
    .field label { display: block; font-size: .75rem; font-weight: 600; color: var(--text-light); margin-bottom: 3px; }

    textarea { min-height: 140px; line-height: 1.7; resize: vertical; }
    .char-count { text-align: right; font-size: .7rem; color: var(--text-light); margin-top: 4px; }

    /* ─── Side panel ─── */
    .panel-title {
      font-size: .85rem; font-weight: 700; color: var(--navy);
      padding-bottom: 8px; border-bottom: 2px solid var(--gold);
      display: flex; justify-content: space-between; align-items: center;
    }
    .toggle { font-size: .72rem; font-weight: 500; color: var(--text-light); display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .preview {
      flex: 1;
      overflow-y: auto;
      background: var(--gray-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      font-size: .8rem;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .btn-row { display: flex; gap: 10px; }
    .copy-btn {
      flex: 1;
      padding: 14px;
      background: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: .05em;
      transition: opacity .2s, background .2s;
    }
    .copy-btn:hover { opacity: .85; }
    .copy-btn:active { transform: scale(.98); }
    .copy-btn.done { background: var(--green); color: var(--white); }
    .clear-btn {
      padding: 14px 18px;
      background: var(--white);
      color: var(--text-light);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .clear-btn:hover { background: var(--red); color: var(--white); border-color: var(--red); }
    .note { font-size: .7rem; color: var(--text-light); }

    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
      background: var(--navy); color: var(--white); padding: 10px 22px; border-radius: 6px;
      font-size: .85rem; opacity: 0; pointer-events: none; transition: all .25s; z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 960px) {
      .app-container { grid-template-columns: 1fr; }
      .side-panel { position: static; height: auto; border-left: none; border-top: 1px solid var(--border); }
      .preview { max-height: 320px; }
      .domain-bar { position: static; }
    }
    @media (max-width: 600px) {
      .app-header { padding: 0 16px; }
      .app-header .internal { display: none; }
      .domain-tabs, .form-panel, .side-panel { padding-left: 16px; padding-right: 16px; }
      .card.branch { margin-left: 10px; }
    }
  </style>
</head>
<body>

<header class="app-header">
  <h1><span class="badge">CRM</span>全ドメイン受付ツール</h1>
  <span class="internal">社内専用 ／ 草案版（質問は仮想データ）</span>
</header>

<nav class="domain-bar">
  <div class="domain-tabs" id="domainTabs"></div>
</nav>

<div class="app-container">
  <main class="form-panel">
    <div class="domain-title">
      <h2 id="domainName"></h2>
      <div class="progress">
        <div id="progressText"></div>
        <div class="progress-bar"><span id="progressBar"></span></div>
      </div>
    </div>

    <div class="section-title">■ 受付基本情報（全ドメイン共通）</div>
    <div class="card">
      <div class="grid-fields" id="commonFields"></div>
    </div>

    <div class="section-title">■ ヒアリング項目</div>
    <div id="questions"></div>

    <div class="section-title">■ フリー記載欄</div>
    <div class="card">
      <textarea id="freeMemo" placeholder="顧客の発言・温度感・特記事項・弁護士への申し送りなど自由に記載してください"></textarea>
      <div class="char-count"><span id="charCount">0</span> 文字</div>
    </div>
  </main>

  <aside class="side-panel">
    <div class="panel-title">
      コピー内容プレビュー
      <label class="toggle"><input type="checkbox" id="includeUnanswered"> 未回答も含める</label>
    </div>
    <div class="preview" id="preview"></div>
    <div class="btn-row">
      <button class="copy-btn" id="copyBtn" type="button">コピー</button>
      <button class="clear-btn" id="clearBtn" type="button">このドメインをクリア</button>
    </div>
    <div class="note">※ ドメインを切り替えても入力内容は保持されます（ページを閉じると消えます）。</div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==========================================================================
   質問データ定義
   --------------------------------------------------------------------------
   ドメインの質問を差し替える場合は、この DOMAINS 配列だけを編集してください。

   各質問の書式:
     { id: '一意のID', label: '質問文', type: 'single' | 'multi' | 'text',
       options: ['選択肢1', '選択肢2', ...],   // single / multi のとき
       hint: '補足（任意）',
       other: true,                             // 「その他」自由入力欄を付ける（任意）
       showIf: { q: '親質問のID', in: ['表示条件となる回答', ...] } // 枝分かれ（任意）
     }
     single = 単一選択（ラジオ） / multi = 複数選択（チェック） / text = 短文入力
   ========================================================================== */
const COMMON_FIELDS = [
  { id: 'date',    label: '受付日時',   type: 'datetime-local' },
  { id: 'staff',   label: '受付担当者', type: 'text', placeholder: '例）山田' },
  { id: 'name',    label: '顧客氏名',   type: 'text', placeholder: '例）佐藤 花子' },
  { id: 'tel',     label: '電話番号',   type: 'tel',  placeholder: '例）090-0000-0000' },
  { id: 'channel', label: '流入経路',   type: 'select',
    options: ['', '電話', 'Web問合せ', 'LINE', 'メール', '紹介', 'その他'] },
];

const DOMAINS = [
  {
    key: 'debt', name: '債務整理', color: '#2c6e9b',
    questions: [
      { id: 'd1', label: '借入先の件数', type: 'single', options: ['1社', '2〜3社', '4〜5社', '6社以上'] },
      { id: 'd2', label: '借入総額（概算）', type: 'single', options: ['50万円未満', '50〜100万円', '100〜300万円', '300〜500万円', '500万円以上'] },
      { id: 'd3', label: '借入先の種類', type: 'multi', options: ['消費者金融', '銀行カードローン', 'クレジットカード', '住宅ローン', '自動車ローン', '個人間'], other: true },
      { id: 'd4', label: '返済の延滞はありますか', type: 'single', options: ['なし', 'あり（3ヶ月未満）', 'あり（3ヶ月以上）'] },
      { id: 'd4a', label: '督促・裁判所からの書類', type: 'multi', options: ['督促状', '一括請求', '支払督促', '訴状', '差押予告'],
        showIf: { q: 'd4', in: ['あり（3ヶ月未満）', 'あり（3ヶ月以上）'] } },
      { id: 'd5', label: '守りたい財産', type: 'multi', options: ['持ち家', '自動車', '保険', '特になし'] },
      { id: 'd6', label: '家族への秘密希望', type: 'single', options: ['内緒にしたい', '知っている', '未確認'] },
    ],
  },
  {
    key: 'hepb', name: 'B型肝炎', color: '#2e8b57',
    questions: [
      { id: 'h1', label: '相談者の立場', type: 'single', options: ['本人', '相続人（遺族）', '家族の代理'] },
      { id: 'h2', label: '生年月日の区分', type: 'single', options: ['昭和16年7月2日〜昭和63年1月27日', 'それ以外', '不明'], hint: '集団予防接種の対象期間に該当するか' },
      { id: 'h3', label: '現在の病態', type: 'single', options: ['無症候性キャリア', '慢性肝炎', '肝硬変', '肝がん', '死亡', '不明'] },
      { id: 'h4', label: '母親の感染状況', type: 'single', options: ['陰性（確認済）', '陽性', '不明', '母が死亡'] },
      { id: 'h4a', label: '母親に代わる確認手段', type: 'multi', options: ['年長のきょうだいの陰性', '母の検査記録あり', '手段なし'],
        showIf: { q: 'h4', in: ['不明', '母が死亡'] } },
      { id: 'h5', label: '手元にある資料', type: 'multi', options: ['血液検査結果', 'カルテ', '母子手帳', '予防接種台帳', 'なし'] },
    ],
  },
  {
    key: 'traffic', name: '交通事故', color: '#c0602b',
    questions: [
      { id: 't1', label: '事故の発生時期', type: 'single', options: ['1ヶ月以内', '1〜6ヶ月', '6ヶ月〜1年', '1年以上前'] },
      { id: 't2', label: '相談者の立場', type: 'single', options: ['被害者', '加害者', '同乗者', '遺族'] },
      { id: 't3', label: '怪我の状況', type: 'multi', options: ['むちうち', '骨折', '後遺障害の可能性', '死亡事故', '物損のみ'] },
      { id: 't4', label: '通院状況', type: 'single', options: ['通院中', '治療終了', '症状固定済', '未通院'] },
      { id: 't5', label: '弁護士費用特約', type: 'single', options: ['あり', 'なし', '不明（要確認）'] },
      { id: 't6', label: '保険会社とのやり取り', type: 'multi', options: ['治療費打切り打診', '示談金提示あり', '過失割合に不満', '特になし'] },
      { id: 't6a', label: '提示された示談金額', type: 'text', placeholder: '例）約80万円',
        showIf: { q: 't6', in: ['示談金提示あり'] } },
    ],
  },
  {
    key: 'family', name: '家事事件', color: '#b0477a',
    questions: [
      { id: 'f1', label: '相談内容', type: 'single', options: ['離婚', '婚姻費用', '養育費', '親権・面会交流', '不貞慰謝料', 'その他'] },
      { id: 'f1a', label: '離婚の進捗', type: 'single', options: ['検討段階', '協議中', '調停中', '裁判中', '別居中'],
        showIf: { q: 'f1', in: ['離婚'] } },
      { id: 'f2', label: '子どもの有無', type: 'single', options: ['なし', '未成年あり', '成人のみ'] },
      { id: 'f3', label: '相手方の状況', type: 'multi', options: ['弁護士あり', 'DV・モラハラ', '連絡が取れない', '同居中'] },
      { id: 'f4', label: '主な争点', type: 'multi', options: ['財産分与', '親権', '養育費', '慰謝料', '年金分割'] },
    ],
  },
  {
    key: 'labor', name: '労働', color: '#6a4fb3',
    questions: [
      { id: 'l1', label: '相談内容', type: 'multi', options: ['残業代未払い', '不当解雇', '退職勧奨', 'ハラスメント', '退職代行', '労災'] },
      { id: 'l2', label: '在職状況', type: 'single', options: ['在職中', '退職済（3年以内）', '退職済（3年超）', '解雇済'] },
      { id: 'l3', label: '雇用形態', type: 'single', options: ['正社員', '契約社員', 'パート・アルバイト', '派遣', '業務委託'] },
      { id: 'l4', label: '証拠の有無', type: 'multi', options: ['タイムカード', '給与明細', '雇用契約書', '録音・メール', 'なし'] },
      { id: 'l4a', label: '1ヶ月の残業時間（目安）', type: 'single', options: ['20時間未満', '20〜45時間', '45〜80時間', '80時間以上'],
        showIf: { q: 'l1', in: ['残業代未払い'] } },
      { id: 'l5', label: '勤務先の規模', type: 'single', options: ['〜10名', '11〜100名', '101〜1000名', '1000名超', '不明'] },
    ],
  },
  {
    key: 'inherit', name: '相続', color: '#8a6d1f',
    questions: [
      { id: 'i1', label: '被相続人との関係', type: 'single', options: ['配偶者', '子', '親', '兄弟姉妹', 'その他'] },
      { id: 'i2', label: '亡くなった時期', type: 'single', options: ['3ヶ月以内', '3〜10ヶ月', '10ヶ月以上', '存命（生前対策）'], hint: '相続放棄・相続税申告の期限に関わります' },
      { id: 'i3', label: '相談内容', type: 'multi', options: ['遺産分割', '相続放棄', '遺留分', '遺言書作成', '相続登記', '使い込み'] },
      { id: 'i4', label: '遺言書の有無', type: 'single', options: ['あり（公正証書）', 'あり（自筆）', 'なし', '不明'] },
      { id: 'i5', label: '主な遺産', type: 'multi', options: ['不動産', '預貯金', '株式', '借金', '不明'] },
      { id: 'i5a', label: '借金の概算', type: 'text', placeholder: '例）約200万円',
        showIf: { q: 'i5', in: ['借金'] } },
      { id: 'i6', label: '相続人間の関係', type: 'single', options: ['良好', '対立あり', '連絡不通者あり'] },
    ],
  },
  {
    key: 'asbestos', name: 'アスベスト', color: '#4f6475',
    questions: [
      { id: 'a1', label: '相談者の立場', type: 'single', options: ['本人', '遺族', '家族の代理'] },
      { id: 'a2', label: '診断された病名', type: 'single', options: ['中皮腫', '肺がん', '石綿肺', 'びまん性胸膜肥厚', '良性石綿胸水', '未診断'] },
      { id: 'a3', label: '従事していた業種', type: 'multi', options: ['建設業', '造船', '石綿工場', '解体', '配管・保温', 'その他'], other: true },
      { id: 'a4', label: '従事時期', type: 'single', options: ['昭和47年〜昭和50年を含む', '昭和50年〜平成16年', 'それ以外', '不明'] },
      { id: 'a5', label: '労災申請状況', type: 'single', options: ['認定済', '申請中', '未申請', '不明'] },
      { id: 'a6', label: '手元の資料', type: 'multi', options: ['診断書', 'CT・レントゲン', '職歴が分かる資料', '労災決定通知', 'なし'] },
    ],
  },
];

/* ==========================================================================
   状態管理（ドメインごとに回答を保持）
   ========================================================================== */
const state = {
  current: DOMAINS[0].key,
  common: {},                 // 共通項目は全ドメインで共有
  answers: {},                // answers[domainKey][qid] = string | string[]
  others: {},                 // others[domainKey][qid] = その他の自由入力
  memo: {},                   // memo[domainKey] = フリー記載
};
DOMAINS.forEach(d => { state.answers[d.key] = {}; state.others[d.key] = {}; state.memo[d.key] = ''; });

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const domain = () => DOMAINS.find(d => d.key === state.current);

function isVisible(q, ans) {
  if (!q.showIf) return true;
  const v = ans[q.showIf.q];
  if (Array.isArray(v)) return v.some(x => q.showIf.in.includes(x));
  return q.showIf.in.includes(v);
}
function hasAnswer(v) { return Array.isArray(v) ? v.length > 0 : !!(v && String(v).trim()); }

/* ─── 描画 ─── */
function renderTabs() {
  $('domainTabs').innerHTML = DOMAINS.map(d => {
    const n = d.questions.filter(q => isVisible(q, state.answers[d.key]) && hasAnswer(state.answers[d.key][q.id])).length;
    return `<button type="button" class="domain-btn ${d.key === state.current ? 'active' : ''}"
              style="--c:${d.color}" data-key="${d.key}">${esc(d.name)}<span class="dot">${n || ''}</span></button>`;
  }).join('');
}

function renderCommon() {
  $('commonFields').innerHTML = COMMON_FIELDS.map(f => {
    const v = esc(state.common[f.id] || '');
    const input = f.type === 'select'
      ? `<select data-common="${f.id}">${f.options.map(o => `<option value="${esc(o)}" ${state.common[f.id] === o ? 'selected' : ''}>${o ? esc(o) : '選択してください'}</option>`).join('')}</select>`
      : `<input type="${f.type}" data-common="${f.id}" value="${v}" placeholder="${esc(f.placeholder || '')}">`;
    return `<div class="field"><label>${esc(f.label)}</label>${input}</div>`;
  }).join('');
}

function renderQuestions() {
  const d = domain();
  const ans = state.answers[d.key];
  const oth = state.others[d.key];
  let num = 0;
  $('questions').innerHTML = d.questions.filter(q => isVisible(q, ans)).map(q => {
    if (!q.showIf) num++;
    const v = ans[q.id];
    const typeLabel = { single: '単一選択', multi: '複数選択可', text: '入力' }[q.type];
    let body = '';
    if (q.type === 'text') {
      body = `<input class="text-input" type="text" data-q="${q.id}" value="${esc(v || '')}" placeholder="${esc(q.placeholder || '')}">`;
    } else {
      const opts = q.other ? [...q.options, 'その他'] : q.options;
      body = `<div class="options">${opts.map(o => {
        const checked = q.type === 'multi' ? (v || []).includes(o) : v === o;
        return `<label class="opt"><input type="${q.type === 'multi' ? 'checkbox' : 'radio'}" name="${q.id}" data-q="${q.id}" value="${esc(o)}" ${checked ? 'checked' : ''}><span>${esc(o)}</span></label>`;
      }).join('')}</div>`;
      const otherOn = q.other && (q.type === 'multi' ? (v || []).includes('その他') : v === 'その他');
      if (otherOn) body += `<input class="text-input" type="text" data-other="${q.id}" value="${esc(oth[q.id] || '')}" placeholder="その他の内容">`;
    }
    return `<div class="card ${q.showIf ? 'branch' : ''} ${hasAnswer(v) ? 'answered' : ''}">
      <div class="q-label">${q.showIf ? '' : `<span class="num">Q${num}</span>`}${esc(q.label)}<span class="type">${typeLabel}</span></div>
      ${q.hint ? `<div class="q-hint">${esc(q.hint)}</div>` : ''}
      ${body}
    </div>`;
  }).join('');
}

function renderAll() {
  const d = domain();
  document.documentElement.style.setProperty('--accent', d.color);
  $('domainName').textContent = d.name;
  $('freeMemo').value = state.memo[d.key];
  renderTabs();
  renderQuestions();
  updateMeta();
}

function updateMeta() {
  const d = domain();
  const ans = state.answers[d.key];
  const visible = d.questions.filter(q => isVisible(q, ans));
  const done = visible.filter(q => hasAnswer(ans[q.id])).length;
  $('progressText').textContent = `回答済 ${done} / ${visible.length}`;
  $('progressBar').style.width = visible.length ? `${done / visible.length * 100}%` : '0';
  $('charCount').textContent = state.memo[d.key].length;
  $('preview').textContent = buildText();
}

/* ─── コピー用テキスト生成 ─── */
function formatDate(v) {
  if (!v) return '';
  const dt = new Date(v);
  if (isNaN(dt)) return v;
  const p = n => String(n).padStart(2, '0');
  return `${dt.getFullYear()}/${p(dt.getMonth() + 1)}/${p(dt.getDate())} ${p(dt.getHours())}:${p(dt.getMinutes())}`;
}

function buildText() {
  const d = domain();
  const ans = state.answers[d.key];
  const oth = state.others[d.key];
  const includeEmpty = $('includeUnanswered').checked;
  const lines = [];

  lines.push(`【${d.name}】受付記録`);
  lines.push('━━━━━━━━━━━━━━━━');
  COMMON_FIELDS.forEach(f => {
    let v = state.common[f.id] || '';
    if (f.id === 'date') v = formatDate(v);
    if (v || includeEmpty) lines.push(`■${f.label}：${v || '未入力'}`);
  });

  lines.push('');
  lines.push('▼ヒアリング内容');
  d.questions.filter(q => isVisible(q, ans)).forEach(q => {
    let v = ans[q.id];
    if (!hasAnswer(v)) {
      if (includeEmpty) lines.push(`${q.showIf ? '　└' : '・'}${q.label}：未回答`);
      return;
    }
    let vals = Array.isArray(v) ? [...v] : [v];
    vals = vals.map(x => (x === 'その他' && oth[q.id]) ? `その他（${oth[q.id]}）` : x);
    lines.push(`${q.showIf ? '　└' : '・'}${q.label}：${vals.join('、')}`);
  });

  const memo = state.memo[d.key].trim();
  if (memo || includeEmpty) {
    lines.push('');
    lines.push('▼フリー記載');
    lines.push(memo || '（記載なし）');
  }
  return lines.join('\n');
}

/* ─── クリップボード ─── */
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    // file:// で開いた場合など Clipboard API が使えない環境向けのフォールバック
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ─── イベント ─── */
$('domainTabs').addEventListener('click', e => {
  const btn = e.target.closest('.domain-btn');
  if (!btn) return;
  state.current = btn.dataset.key;
  renderAll();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

$('commonFields').addEventListener('input', e => {
  const id = e.target.dataset.common;
  if (!id) return;
  state.common[id] = e.target.value;
  updateMeta();
});

$('questions').addEventListener('change', e => {
  const qid = e.target.dataset.q;
  if (!qid || e.target.type === 'text') return;
  const d = domain();
  const q = d.questions.find(x => x.id === qid);
  const ans = state.answers[d.key];
  if (q.type === 'multi') {
    ans[qid] = [...document.querySelectorAll(`input[name="${qid}"]:checked`)].map(i => i.value);
  } else {
    ans[qid] = e.target.value;
  }
  // 非表示になった枝分かれ質問の回答は破棄
  d.questions.forEach(x => { if (!isVisible(x, ans)) delete ans[x.id]; });
  renderTabs();
  renderQuestions();
  updateMeta();
});

// 単一選択：選択済みの項目をもう一度クリックで解除
$('questions').addEventListener('click', e => {
  const input = e.target.closest('.opt')?.querySelector('input[type="radio"]');
  if (!input || e.target.tagName === 'INPUT') return;
  if (input.checked) {
    e.preventDefault();
    const d = domain();
    const ans = state.answers[d.key];
    delete ans[input.dataset.q];
    d.questions.forEach(x => { if (!isVisible(x, ans)) delete ans[x.id]; });
    renderTabs();
    renderQuestions();
    updateMeta();
  }
});

$('questions').addEventListener('input', e => {
  const d = domain();
  if (e.target.dataset.other) {
    state.others[d.key][e.target.dataset.other] = e.target.value;
  } else if (e.target.dataset.q && e.target.type === 'text') {
    state.answers[d.key][e.target.dataset.q] = e.target.value;
    e.target.closest('.card').classList.toggle('answered', !!e.target.value.trim());
    renderTabs();
  } else return;
  updateMeta();
});

$('freeMemo').addEventListener('input', e => {
  state.memo[state.current] = e.target.value;
  updateMeta();
});

$('includeUnanswered').addEventListener('change', updateMeta);

$('copyBtn').addEventListener('click', async () => {
  const ok = await copyText(buildText());
  const btn = $('copyBtn');
  if (ok) {
    btn.textContent = 'コピーしました ✓';
    btn.classList.add('done');
    toast(`【${domain().name}】の受付内容をクリップボードにコピーしました`);
    setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('done'); }, 1800);
  } else {
    toast('コピーに失敗しました。プレビューを選択して手動でコピーしてください');
  }
});

$('clearBtn').addEventListener('click', () => {
  const d = domain();
  if (!confirm(`【${d.name}】の回答とフリー記載をクリアします。よろしいですか？\n（受付基本情報は残ります）`)) return;
  state.answers[d.key] = {};
  state.others[d.key] = {};
  state.memo[d.key] = '';
  renderAll();
});

/* ─── 初期化 ─── */
(function init() {
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  state.common.date = now.toISOString().slice(0, 16);
  renderCommon();
  renderAll();
})();
</script>
</body>
</html>
