<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リード詳細分析（B型肝炎／家事事件）</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: #0f1b2d;
  }
  .switcher-bar {
    position: sticky;
    top: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: #15233a;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .switcher-bar .sw-label {
    color: rgba(255,255,255,0.65);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-right: 4px;
    white-space: nowrap;
  }
  .sw-btn {
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 700;
    padding: 8px 22px;
    border-radius: 999px;
    border: 1.5px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.85);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .sw-btn:hover {
    background: rgba(255,255,255,0.14);
  }
  .sw-btn[aria-pressed="true"] {
    background: #ffffff;
    color: #15233a;
    border-color: #ffffff;
  }
  .frame-wrap {
    position: relative;
    height: calc(100vh - 57px);
  }
  iframe.tool-frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
    background: #fff;
  }
  iframe.tool-frame.active {
    display: block;
  }
</style>
</head>
<body>
<div class="switcher-bar">
  <span class="sw-label">対象分野</span>
  <button type="button" class="sw-btn" id="sw-bkan" aria-pressed="true">B型肝炎</button>
  <button type="button" class="sw-btn" id="sw-kaji" aria-pressed="false">家事事件</button>
</div>
<div class="frame-wrap">
  <iframe class="tool-frame active" id="frame-bkan" title="B型肝炎 リード詳細分析"></iframe>
  <iframe class="tool-frame" id="frame-kaji" title="家事 リード詳細分析"></iframe>
</div>
<script>
  const BKAN_HTML = "<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>B\u578b\u809d\u708e \u30ea\u30fc\u30c9\u8a73\u7d30\u5206\u6790</title>\n<style>\n  :root {\n    color-scheme: light;\n    --surface-1:    #fcfcfb;\n    --surface-2:    #f9f9f7;\n    --surface-card: #ffffff;\n    --text-primary:   #0b0b0b;\n    --text-secondary: #52514e;\n    --text-muted:     #898781;\n    --grid:      #e1e0d9;\n    --baseline:  #c3c2b7;\n    --border:    rgba(11,11,11,0.10);\n\n    --s0: #898781; /* neutral (\u30ea\u30fc\u30c9\u5408\u8a08) */\n    --s1: #2a78d6; /* blue (\u30a2\u30b7\u30ed) */\n    --s2: #eb6834; /* orange (\u30bb\u30eb\u30d5) */\n    --s3: #1baf7a; /* aqua (\u30aa\u30fc\u30ac\u30cb\u30c3\u30af) */\n\n    --good:     #0ca30c;\n    --warning:  #fab219;\n    --critical: #d03b3b;\n\n    --lane-bg: #f0efec;\n  }\n  @media (prefers-color-scheme: dark) {\n    :root:not([data-theme=\"light\"]) {\n      color-scheme: dark;\n      --surface-1:    #1a1a19;\n      --surface-2:    #0d0d0d;\n      --surface-card: #232322;\n      --text-primary:   #ffffff;\n      --text-secondary: #c3c2b7;\n      --text-muted:     #898781;\n      --grid:      #2c2c2a;\n      --baseline:  #383835;\n      --border:    rgba(255,255,255,0.10);\n\n      --s0: #898781;\n      --s1: #3987e5;\n      --s2: #d95926;\n      --s3: #199e70;\n\n      --lane-bg: #2c2c2a;\n    }\n  }\n  :root[data-theme=\"dark\"] {\n    color-scheme: dark;\n    --surface-1:    #1a1a19;\n    --surface-2:    #0d0d0d;\n    --surface-card: #232322;\n    --text-primary:   #ffffff;\n    --text-secondary: #c3c2b7;\n    --text-muted:     #898781;\n    --grid:      #2c2c2a;\n    --baseline:  #383835;\n    --border:    rgba(255,255,255,0.10);\n\n    --s0: #898781;\n    --s1: #3987e5;\n    --s2: #d95926;\n    --s3: #199e70;\n\n    --lane-bg: #2c2c2a;\n  }\n\n  * { box-sizing: border-box; }\n  body {\n    margin: 0;\n    background: var(--surface-2);\n    color: var(--text-primary);\n    font-family: system-ui, -apple-system, \"Segoe UI\", \"Noto Sans JP\", sans-serif;\n    padding-bottom: 64px;\n  }\n\n  header.top {\n    background: var(--surface-card);\n    border-bottom: 1px solid var(--border);\n    padding: 16px 24px;\n    position: sticky;\n    top: 0;\n    z-index: 10;\n  }\n  header.top h1 { font-size: 1.25rem; font-weight: 700; margin: 0 0 4px; }\n  header.top p { margin: 0 0 12px; font-size: .82rem; color: var(--text-muted); }\n  .badge-demo {\n    display: inline-block; font-size: .68rem; font-weight: 700; color: var(--s1);\n    border: 1px solid var(--s1); border-radius: 20px; padding: 1px 10px; margin-left: 8px; vertical-align: middle;\n  }\n\n  .month-picker { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }\n  .month-picker .mp-label { font-size: .76rem; font-weight: 700; color: var(--text-muted); }\n  .month-btn {\n    font-family: inherit; font-size: .8rem; font-weight: 700; padding: 6px 14px; border-radius: 20px;\n    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary); cursor: pointer;\n  }\n  .month-btn[aria-pressed=\"true\"] { background: var(--s1); border-color: var(--s1); color: #fff; }\n  .month-btn--note { border-style: dashed; }\n  .month-btn--note[aria-pressed=\"true\"] { background: var(--warning); border-color: var(--warning); }\n  .period-note { font-size: .78rem; color: var(--warning); font-weight: 700; margin: 0 0 16px; }\n\n  .entity-sticky-bar {\n    position: sticky; top: var(--header-h, 76px); z-index: 9;\n    background: var(--surface-card); border-bottom: 1px solid var(--border);\n    padding: 12px 24px;\n  }\n  .entity-sticky-inner {\n    max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;\n  }\n  .entity-sticky-inner .mp-label { font-size: .76rem; font-weight: 700; color: var(--text-muted); flex-shrink: 0; }\n\n  main { max-width: 1080px; margin: 0 auto; padding: 24px; }\n\n  section.card {\n    background: var(--surface-card); border: 1px solid var(--border); border-radius: 10px;\n    padding: 20px 22px; margin-bottom: 20px;\n  }\n  section.card h2 { font-size: .98rem; font-weight: 700; margin: 0 0 4px; }\n  section.card .card-sub { font-size: .78rem; color: var(--text-muted); margin: 0 0 16px; }\n\n  .sub-head { font-size: .78rem; font-weight: 700; color: var(--text-muted); margin: 22px 0 10px; }\n  .sub-head:first-of-type { margin-top: 0; }\n  .sub-note { font-size: .74rem; color: var(--text-muted); margin: -6px 0 12px; }\n\n  /* ---- KPI tiles ---- */\n  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 4px; }\n  .kpi-tile { border: 1px solid var(--border); border-radius: 8px; padding: 16px; }\n  .kpi-tile .kpi-label { font-size: .76rem; color: var(--text-muted); margin-bottom: 6px; }\n  .kpi-tile .kpi-value { font-size: 1.6rem; font-weight: 700; line-height: 1.2; white-space: nowrap; }\n  .kpi-tile .kpi-unit { font-size: .82rem; font-weight: 400; color: var(--text-secondary); margin-left: 2px; }\n  .kpi-tile.hero .kpi-value { color: var(--s1); }\n\n  /* ---- entity toggle ---- */\n  .agency-toggle { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }\n  .agency-btn {\n    font-family: inherit; font-size: .82rem; font-weight: 700; padding: 8px 14px; border-radius: 20px;\n    border: 1.5px solid var(--border); background: var(--surface-1); color: var(--text-secondary); cursor: pointer;\n    display: flex; align-items: center; gap: 8px;\n  }\n  .agency-btn .swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }\n  .agency-btn.all-btn { border-style: dashed; }\n  .agency-btn.all-btn .swatch { border-radius: 2px; }\n  .agency-btn .cnt { font-variant-numeric: tabular-nums; color: var(--text-muted); }\n  .agency-btn[aria-pressed=\"true\"] { border-color: currentColor; border-style: solid; background: var(--surface-card); color: var(--text-primary); box-shadow: 0 0 0 1px currentColor inset; }\n\n  /* ---- ROAS row ---- */\n  .roas-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 14px 0 4px; }\n  .roas-tile { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; background: var(--surface-1); }\n  .roas-tile .roas-label { font-size: .72rem; color: var(--text-muted); margin-bottom: 4px; }\n  .roas-tile .roas-value { font-size: 1.3rem; font-weight: 700; }\n  .roas-tile .roas-note { font-size: .7rem; color: var(--text-muted); margin-top: 2px; }\n  .roas-tile .roas-rate-note { font-size: .95rem; font-weight: 700; margin-top: 4px; }\n  .roas-note-box { font-size: .74rem; color: var(--text-muted); margin-bottom: 14px; }\n\n  /* ---- high-value zone ---- */\n  .highzone-box {\n    display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px;\n    border-top: 1px solid var(--grid);\n    margin-top: 24px; padding-top: 16px; margin-bottom: 18px;\n  }\n  .highzone-box .hz-label { font-size: .82rem; font-weight: 700; color: var(--text-secondary); }\n  .highzone-box .hz-value { font-size: .82rem; font-weight: 700; }\n  .highzone-box .hz-detail { font-size: .78rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }\n  .highzone-box .hz-note { flex-basis: 100%; font-size: .74rem; color: var(--text-muted); margin-top: 2px; }\n\n  /* ---- rate section ---- */\n  .rate-group { margin-bottom: 16px; }\n  .rate-group:last-child { margin-bottom: 0; }\n  .rate-group-head { font-size: .84rem; font-weight: 700; margin-bottom: 8px; }\n  .rate-line { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }\n  .rate-line:last-child { margin-bottom: 0; }\n  .rate-tag { width: 110px; flex-shrink: 0; font-size: .74rem; font-weight: 700; }\n  .rate-track { flex: 1; height: 10px; border-radius: 4px; background: var(--lane-bg); overflow: hidden; }\n  .rate-fill { height: 100%; border-radius: 0 4px 4px 0; }\n  .rate-val { width: 230px; flex-shrink: 0; text-align: right; font-size: .74rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; }\n  .rate-val strong { color: var(--text-primary); font-weight: 700; }\n\n  @media (max-width: 640px) {\n    .rate-tag { width: 76px; font-size: .68rem; }\n    .rate-val { width: 160px; font-size: .68rem; }\n  }\n\n  /* ---- breakdown bars ---- */\n  .grp { margin-bottom: 18px; }\n  .grp:last-child { margin-bottom: 0; }\n  .grp-head { display: flex; justify-content: space-between; align-items: baseline; font-size: .82rem; font-weight: 700; color: var(--text-secondary); border-bottom: 1px solid var(--grid); padding-bottom: 6px; margin-bottom: 10px; }\n  .grp-head .grp-sub { font-weight: 400; color: var(--text-muted); font-variant-numeric: tabular-nums; }\n  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }\n  .bar-row:last-child { margin-bottom: 0; }\n  .bar-cat { width: 200px; flex-shrink: 0; font-size: .8rem; color: var(--text-primary); }\n  .bar-lane { flex: 1; height: 18px; background: var(--lane-bg); border-radius: 4px; position: relative; }\n  .bar-fill { height: 100%; border-radius: 0 4px 4px 0; }\n  .bar-figs { width: 260px; flex-shrink: 0; text-align: right; font-size: .78rem; font-variant-numeric: tabular-nums; color: var(--text-secondary); }\n  .bar-figs strong { color: var(--text-primary); font-weight: 700; }\n  .bar-figs-sub { display: block; font-size: .7rem; color: var(--text-muted); margin-top: 1px; }\n  .bar-figs-sub.newrate { font-size: 1rem; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }\n\n  .bar-row--sub { margin-bottom: 6px; padding-left: 20px; }\n  .bar-row--sub .bar-cat { width: 180px; font-size: .74rem; color: var(--text-secondary); }\n  .bar-row--sub .bar-lane { height: 12px; }\n  .bar-row--sub .bar-fill { opacity: .6; }\n  .bar-row--sub .bar-figs { font-size: .72rem; }\n  .bar-row--sub .bar-figs-sub.newrate { font-size: .88rem; }\n\n  .newrate-hero { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin: 2px 0 16px; padding-bottom: 14px; border-bottom: 1px solid var(--grid); }\n  .newrate-hero-label { font-size: .8rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }\n  .newrate-hero-value { font-size: 2rem; font-weight: 700; line-height: 1; white-space: nowrap; flex-shrink: 0; }\n  .newrate-hero-note { flex-basis: 100%; font-size: .72rem; color: var(--text-muted); }\n\n  /* ---- trend chart ---- */\n  .trend-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 10px; font-size: .78rem; color: var(--text-secondary); }\n  .trend-legend .item { display: flex; align-items: center; gap: 6px; }\n  .trend-legend .item .swatch { width: 10px; height: 10px; border-radius: 2px; }\n  .trend-chart { width: 100%; height: auto; display: block; }\n  .trend-chart text { font-size: 10px; fill: var(--text-muted); font-family: inherit; }\n  .trend-chart .axis-line { stroke: var(--baseline); stroke-width: 1; }\n  .trend-chart .grid-line { stroke: var(--grid); stroke-width: 1; }\n  .trend-chart .series-line { fill: none; stroke-width: 2; }\n  .trend-chart .series-dot { stroke: var(--surface-card); stroke-width: 1.5; }\n\n  /* ---- jump nav ---- */\n  .jump-nav {\n    position: fixed; right: 18px; top: 50%; transform: translateY(-50%); z-index: 15;\n    display: flex; flex-direction: column; gap: 8px;\n  }\n  .jump-btn {\n    font-family: inherit; font-size: .74rem; font-weight: 700; padding: 10px 8px; border-radius: 8px;\n    border: 1px solid var(--border); background: var(--surface-card); color: var(--text-secondary); cursor: pointer;\n    box-shadow: 0 2px 8px rgba(0,0,0,.10); white-space: nowrap;\n  }\n  .jump-btn:hover { background: var(--s1); color: #fff; border-color: var(--s1); }\n  @media (max-width: 860px) { .jump-nav { display: none; } }\n\n  /* ---- tables ---- */\n  .table-toggle { font-family: inherit; font-size: .8rem; font-weight: 700; color: var ow').innerHTML = `\n    <div class=\"kpi-tile hero\">\n      <div class=\"kpi-label\">\u30ea\u30fc\u30c9\u5408\u8a08\u5b9f\u7e3e\uff08\u53d7\u4efb\u6570\uff09</div>\n      <div class=\"kpi-value\">${fmt(leadTotal)}<span class=\"kpi-unit\">\u4ef6</span></div>\n    </div>\n    <div class=\"kpi-tile\">\n      <div class=\"kpi-label\">\u30ea\u30fc\u30c9\u5408\u8a08\u671f\u5f85\u53ce\u76ca</div>\n      <div class=\"kpi-value\">${fmtYen(leadRevenue)}</div>\n    </div>\n    <div class=\"kpi-tile\">\n      <div class=\"kpi-label\">\u30ea\u30fc\u30c9\u5408\u8a08ROAS</div>\n      <div class=\"kpi-value\">${pct(roas)}</div>\n    </div>\n  `;\n}\n\nfunction renderEntityToggle() {\n  const m = currentMonthData();\n  const el = document.getElementById('entity-toggle');\n  el.innerHTML = '';\n  ENTITIES.forEach(ent => {\n    const btn = document.createElement('button');\n    btn.className = 'agency-btn' + (ent.dashed ? ' all-btn' : '');\n    btn.style.color = ent.color;\n    btn.setAttribute('aria-pressed', ent.key === activeEntity ? 'true' : 'false');\n    btn.innerHTML = `<span class=\"swatch\" style=\"background:${ent.color}\"></span>${ent.label}<span class=\"cnt\">${fmt(entityTotal(m, ent.key))}\u4ef6</span>`;\n    btn.addEventListener('click', () => {\n      activeEntity = ent.key;\n      renderEntityToggle();\n      renderInflowBreakdown();\n      renderNewCountBreakdown();\n      renderCallBreakdown();\n      renderReservation();\n      renderRoas();\n      renderBreakdown();\n      renderHighzone();\n      renderSymptomRateBreakdown();\n    });\n    el.appendChild(btn);\n  });\n}\n\nfunction renderInflowBreakdown() {\n  const m = currentMonthData();\n  const ent = ENTITIES.find(e => e.key === activeEntity);\n  const grandTotal = m.inflow.total[activeEntity] || 0;\n  const maxVal = grandTotal || 1;\n  const el = document.getElementById('inflow-breakdown');\n  el.innerHTML = `\n    <div class=\"grp\">\n      <div class=\"grp-head\"><span>\u7dcf\u6d41\u5165\u4ef6\u6570</span><span class=\"grp-sub\">\u8a08 ${fmt(grandTotal)}\u4ef6</span></div>\n      ${INFLOW_CATS.map(cat => {\n        const cTotal = m.inflow[cat.key].total[activeEntity] || 0;\n        const cRatio = (m.inflowRatio[cat.key].total[activeEntity] || 0) * 100;\n        const w = maxVal ? cTotal / maxVal * 100 : 0;\n        const subRows = cat.symptoms ? cat.symptoms.map(sk => {\n          const sv = m.inflow[cat.key][sk][activeEntity] || 0;\n          const sRatio = (m.inflowRatio[cat.key][sk][activeEntity] || 0) * 100;\n          const sw = maxVal ? sv / maxVal * 100 : 0;\n          return `\n            <div class=\"bar-row bar-row--sub\">\n              <div class=\"bar-cat\">${SYMPTOM_LABELS[sk]}</div>\n              <div class=\"bar-lane\"><div class=\"bar-fill\" style=\"width:${sw}%;background:${ent.color}\"></div></div>\n              <div class=\"bar-figs\">${fmt(sv)}\u4ef6\uff08${pct(sRatio)}\uff09</div>\n            </div>\n          `;\n        }).join('') : '';\n        return `\n          <div class=\"bar-row\">\n            <div class=\"bar-cat\">${cat.label.split('\uff08')[0]}</div>\n            <div class=\"bar-lane\"><div class=\"bar-fill\" style=\"width:${w}%;background:${ent.color}\"></div></div>\n            <div class=\"bar-figs\"><strong>${fmt(cTotal)}</strong>\u4ef6\uff08\u6d41\u5165\u69cb\u6210\u6bd4 ${pct(cRatio)}\uff09</div>\n          </div>\n          ${subRows}\n        `;\n      }).join('')}\n    </div>\n  `;\n}\n\nfunction renderNewCountBreakdown() {\n  const m = currentMonthData();\n  const ent = ENTITIES.find(e => e.key === activeEntity);\n  const grandTotal = m.newCount.total[activeEntity] || 0;\n  const maxVal = grandTotal || 1;\n  const overallRateRaw = m.newRate.total[activeEntity];\n  const overallRate = typeof overallRateRaw === 'number' ? overallRateRaw * 100 : null;\n  const el = document.getElementById('newcount-breakdown');\n  el.innerHTML = `\n    <div class=\"grp\">\n      <div class=\"grp-head\"><span>\u5bfe\u5fdc\u53ef\u80fd\u65b0\u898f\u6570</span><span class=\"grp-sub\">\u8a08 ${fmt(grandTotal)}\u4ef6</span></div>\n      <div class=\"newrate-hero\">\n        <span class=\"newrate-hero-label\">\u65b0\u898f\u7387\uff08\u8a08\u30fb\u5bfe\u6d41\u5165\uff09</span>\n        <span class=\"newrate-hero-value\" style=\"color:${ent.color}\">${pct(overallRate)}</span>\n        <span class=\"newrate-hero-note\">\u65b0\u898f\u7387\uff1d\u5bfe\u5fdc\u53ef\u80fd\u65b0\u898f\u6570 \u00f7 \u7dcf\u6d41\u5165\u4ef6\u6570\u3002\u96c6\u5ba2\u72b6\u6cc1\uff08\u91cd\u8907\u30fb\u8ffd\u5ba2\u4e0d\u53ef\u306e\u5c11\u306a\u3055\uff09\u3092\u793a\u3059\u6307\u6a19\u3067\u3059\u3002</span>\n      </div>\n      ${INFLOW_CATS.map(cat => {\n        const cNew = m.newCount[cat.key].total[activeEntity] || 0;\n        const cCompRatio = grandTotal ? (cNew / grandTotal * 100) : 0;\n        const cNewRateRaw = m.newRate[cat.key].total[activeEntity];\n        const cNewRate = typeof cNewRateRaw === 'number' ? cNewRateRaw * 100 : null;\n        const w = maxVal ? cNew / maxVal * 100 : 0;\n        const subRows = cat.symptoms ? cat.symptoms.map(sk => {\n          const sNew = m.newCount[cat.key][sk][activeEntity] || 0;\n          const sCompRatio = grandTotal ? (sNew / grandTotal * 100) : 0;\n          const sNewRateRaw = m.newRate[cat.key][sk][activeEntity];\n          const sNewRate = typeof sNewRateRaw === 'number' ? sNewRateRaw * 100 : null;\n          const sw = maxVal ? sNew / maxVal * 100 : 0;\n          return `\n            <div class=\"bar-row bar-row--sub\">\n              <div class=\"bar-cat\">${SYMPTOM_LABELS[sk]}</div>\n              <div class=\"bar-lane\"><div class=\"bar-fill\" style=\"width:${sw}%;background:${ent.color}\"></div></div>\n              <div class=\"bar-figs\">${fmt(sNew)}\u4ef6\uff08${pct(sCompRatio)}\uff09<span class=\"bar-figs-sub newrate\" style=\"color:${ent.color}\">\u65b0\u898f\u7387${pct(sNewRate)}</span></div>\n            </div>\n          `;\n        }).join('') : '';\n        return `\n          <div class=\"bar-row\">\n            <div class=\"bar-cat\">${cat.label.split('\uff08')[0]}</div>\n            <div class=\"bar-lane\"><div class=\"bar-fill\" style=\"width:${w}%;background:${ent.color}\"></div></div>\n            <div class=\"bar-figs\"><strong>${fmt(cNew)}</strong>\u4ef6\uff08\u65b0\u898f\u69cb\u6210\u6bd4 ${pct(cCompRatio)}\uff09<span class=\"bar-figs-sub newrate\" style=\"color:${ent.color}\">\u65b0\u898f\u7387${pct(cNewRate)}</span></div>\n          </div>\n          ${subRows}\n        `;\n      }).join('')}\n    </div>\n  `;\n}\n\nfunction renderCallBreakdown() {\n  const m = currentMonthData();\n  const ent = ENTITIES.find(e => e.key === activeEntity);\n  const calls = m.calls[activeEntity] || 0;\n  const talks = m.talks[activeEntity] || 0;\n  const newTotal = m.newCount.total[activeEntity] || 0;\n  const callRate = newTotal ? (calls / newTotal) * 100 : null;\n  const talkRate = calls ? (talks / calls) * 100 : null;\n  document.getElementById('call-breakdown').innerHTML = `\n    <div class=\"grp\">\n      <div class=\"grp-head\"><span>\u67b6\u96fb\u6570\u30fb\u901a\u8a71\u6570</span></div>\n      <div class=\"roas-row\">\n        <div class=\"roas-tile\">\n          <div class=\"roas-label\">\u67b6\u96fb\u6570</div>\n          <div class=\"roas-value\">${fmt(calls)}\u4ef6</div>\n          <div class=\"roas-rate-note\" style=\"color:${ent.color}\">\u67b6\u96fb\u7387 ${pct(callRate)}</div>\n          <div class=\"roas-note\">\u67b6\u96fb\u7387\uff1d\u67b6\u96fb\u6570 \u00f7 \u5bfe\u5fdc\u53ef\u80fd\u65b0\u898f\u6570\u5408\u8a08</div>\n        </div>\n        <div class=\"roas-tile\">\n          <div class=\"roas-label\">\u901a\u8a71\u6570</div>\n          <div class=\"roas-value\">${fmt(talks)}\u4ef6</div>\n          <div class=\"roas-rate-note\" style=\"color:${ent.color}\">\u901a\u8a71\u7387 ${pct(talkRate)}</div>\n          <div class=\"roas-note\">\u901a\u8a71\u7387\uff1d\u901a\u8a71\u6570 \u00f7 \u67b6\u96fb\u6570</div>\n        </div>\n      </div>\n    </div>\n  `;\n}\n\nfunction renderReservation() {\n  const m = currentMonthData();\n  const ent = ENTITIES.find(e => e.key === activeEntity);\n  const total = m.reservation.total[activeEntity] || 0;\n  const maxVal = total || 1;\n  const cats = [\n    { key: 'byoutai_ari', label: '\u75c5\u614b\u3042\u308a' },\n    { key: 'carrier', label: '\u30ad\u30e3\u30ea\u30a2' },\n  ];\n  document.getElementById('reservation-breakdown').innerHTML = `\n    <div class=\"grp\">\n      <div class=\"grp-head\"><span>\u4e88\u7d04\u6570</span><span class=\"grp-sub\">\u8a08 ${fmt(total)}\u4ef6</span></div>\n      ${cats.map(c => {\n        const v = m.reservation[c.key][activeEntity] || 0;\n        const r = (m.reservationRatio[c.key][activeEntity] || 0) * 100;\n        const w = maxVal ? v / maxVal * 100 : 0;\n        return `\n          <div class=\"bar-row\">\n            <div class=\"bar-cat\">${c.label}</div>\n            <div class=\"bar-lane\"><div class=\"bar-fill\" style=\"width:${w}%;background:${ent.color}\"></div></div>\n            <div class=\"bar-figs\"><strong>${fmt(v)}</strong>\u4ef6\uff08\u4e88\u7d04\u69cb\u6210\u6bd4 ${pct(r)}\uff09</div>\n          </div>\n        `;\n      }).join('')}\n    </div>\n  `;\n}\n\nfunction renderRoas() {\n  const m = currentMonthData();\n  const el = document.getElementById('roas-row');\n  const ent = ENTITIES.find(e => e.key === activeEntity);\n\n  const adSpend = m.adSpend[activeEntity];\n  const revenue = m.revenue[activeEntity];\n\n  if (!adSpend) {\n    el.innerHTML = `<p class=\"roas-note-box\">${ent.label}\u306f\u5e83\u544a\u8cbb\u3092\u304b\u3051\u3066\u3044\u306a\u3044\u6d41\u5165\u7d4c\u8def\u306e\u305f\u3081\u3001\u5e83\u544a\u8cbb\u30fbROAS\u306e\u7b97\u51fa\u5bfe\u8c61\u5916\u3067\u3059\uff08\u671f\u5f85\u53ce\u76ca\uff1a<strong>${fmtYen(revenue)}</strong>\uff09\u3002</p>`;\n    return;\n  }\n  const roas = (revenue / adSpend) * 100;\n  const roasClass = roas >= 250 ? 'style=\"color:var(--good)\"' : (roas < 150 ? 'style=\"color:var(--critical)\"' : '');\n  el.innerHTML = `\n    <div class=\"roas-row\">\n      <div class=\"roas-tile\">\n        <div class=\"roas-label\">\u5e83\u544a\u8cbb</div>\n        <div class=\"roas-value\">${fmtYen(adSpend)}</div>\n      </div>\n      <div class=\"roas-tile\">\n        <div class=\"roas-label\">\u671f\u5f85\u53ce\u76ca</div>\n        <div class=\"roas-value\">${fmtYen(revenue)}</div>\n      </div>\n      <div class=\"roas-tile\">\n        <div class=\"roas-label\">ROAS\uff08\u671f\u5f85\u53ce\u76ca \u00f7 \u5e83\u544a\u8cbb\uff09</div>\n        <div class=\"roas-value\" ${roasClass}>${pct(roas)}</div>\n        <div class=\"roas-note\">\u76ee\u5b89\uff1a250%\u4ee5\u4e0a=\u826f\u597d\uff0f150%\u672a\u6e80=\u8981\u6ce8\u610f</div>\n      </div>\n    </div>\n  `;\n}\n\nfunction renderBreakdown() {\n  const m = currentMonthData();\n  const ent = ENTITIES.find(e => e.key === activeEntity);\n  const denom = entityTotal(m, activeEntity);\n  const maxVal = Math.max(...getAllKeys().map(k => m.items[k][activeEntity] || 0), 1);\n\n  const el = document.getElementById('breakdown');\n  el.innerHTML = GROUPS.map(g => {\n    const groupTotal = g.items.reduce((a, it) => a + (m.items[it.key][activeEntity] || 0), 0);\n    const groupShare = denom ? (groupTotal / denom) * 100 : 0;\n    const headHtml = g.name\n      ? `<div class=\"grp-head\"><span>${g.name}</span><span class=\"grp-sub\">\u8a08 ${fmt(groupTotal)}\u4ef6\uff08${pct(groupShare)}\uff09</span></div>`\n      : '';\n    const rows = g.items.map(it => {\n      const v = m.items[it.key][activeEntity] || 0;\n      const w = (Math.max(0, v) / maxVal) * 100;\n      const share = denom ? (v / denom) * 100 : 0;\n      return `\n        <div class=\"bar-row\">\n          <div class=\"bar-cat\">${it.name}</div>\n          <div class=\"bar-lane\"><div class=\"bar-fill\" style=\"width:${w}%;background:${ent.color}\"></div></div>\n          <div class=\"bar-figs\"><strong>${fmt(v)}</strong>\u4ef6\uff08${pct(share)}\uff09</div>\n        </div>\n      `;\n    }).join('');\n    return `<div class=\"grp\">${headHtml}${rows}</div>`;\n  }).join('');\n}\n\nfunction renderHighzone() {\n  const m = currentMonthData();\n  const ent = ENTITIES.find(e => e.key === activeEntity);\n  const hz = highzoneCount(m, activeEntity);\n  const total = entityTotal(m, activeEntity);\n  const ratio = total ? (hz / total) * 100 : 0;\n  document.getElementById('highzone-box').innerHTML = `\n    <span class=\"hz-label\">\u9ad8\u984d\u30be\u30fc\u30f3\u6bd4\u7387\uff08${HIGHZONE_LABEL}\uff09</span>\n    <span class=\"hz-value\" style=\"color:${ent.color}\">${pct(ratio)}</span>\n    <span class=\"hz-detail\">\uff08\u9ad8\u984d\u30be\u30fc\u30f3 ${fmt(hz)}\u4ef6 \uff0f ${ent.label} ${fmt(total)}\u4ef6\uff09</span>\n    <span class=\"hz-note\">\u203b\u7d4c\u8def\u3054\u3068\u306b\u5358\u4fa1\u306f\u7570\u306a\u308a\u307e\u3059\u304c\u3001\u9ad8\u984d\u30be\u30fc\u30f3\u6bd4\u7387\u306f\u4e8b\u52d9\u6240\u5168\u4f53\u5b9a\u7fa9\u3068\u540c\u69d8\u306e\u7b97\u51fa\u65b9\u6cd5\uff08\u9ad8\u984d\u30be\u30fc\u30f3\u53d7\u4efb\u4ef6\u6570 \u00f7 \u53d7\u4efb\u4ef6\u6570\u5408\u8a08\uff09\u3067\u3059\u3002</span>\n  `;\n}\n\nfunction renderSymptomRateBreakdown() {\n  const m = currentMonthData();\n  const ent = ENTITIES.find(e => e.key === activeEntity);\n  const el = document.getElementById('symptom-rate-breakdown');\n  el.innerHTML = GROUPS.map(g => {\n    const acceptedTotal = g.items.reduce((s, it) => s + (m.items[it.key][activeEntity] || 0), 0);\n    const meetingsTotal = g.items.reduce((s, it) => s + (m.meetings[it.key][activeEntity] || 0), 0);\n    const groupRate = meetingsTotal ? (acceptedTotal / meetingsTotal) * 100 : null;\n    const headHtml = `<div class=\"grp-head\"><span>${g.name}</span><span class=\"grp-sub\">\u53d7\u4efb\u7387 ${pct(groupRate)}\uff08\u53d7\u4efb${fmt(acceptedTotal)}\uff0f\u9762\u8ac7${fmt(meetingsTotal)}\uff09</span></div>`;\n    const rows = g.items.map(it => {\n      const accepted = m.items[it.key][activeEntity] || 0;\n      const meetings = m.meetings[it.key][activeEntity] || 0;\n      const rate = meetings ? (accepted / meetings) * 100 : null;\n      const w = rate !== null ? Math.max(0, Math.min(100, rate)) : 0;\n      return `\n        <div class=\"bar-row\">\n          <div class=\"bar-cat\">${it.name}</div>\n          <div class=\"bar-lane\"><div class=\"bar-fill\" style=\"width:${w}%;background:${ent.color}\"></div></div>\n          <div class=\"bar-figs\"><strong>${pct(rate)}</strong>\uff08\u53d7\u4efb${fmt(accepted)}\uff0f\u9762\u8ac7${fmt(meetings)}\uff09</div>\n        </div>\n      `;\n    }).join('');\n    return `<div class=\"grp\">${headHtml}${rows}</div>`;\n  }).join('');\n}\n\nfunction renderTables() {\n  const m = currentMonthData();\n  const el = document.getElementById('tables');\n  const cols = [\n    { key: 'ashiro', label: '\u30a2\u30b7\u30ed' },\n    { key: 'self', label: '\u30bb\u30eb\u30d5' },\n    { key: 'organic', label: '\u30aa\u30fc\u30ac\u30cb\u30c3\u30af' },\n    { key: 'lead', label: '\u30ea\u30fc\u30c9\u5408\u8a08' },\n  ];\n  const headCols = cols.map(c => `<th>${c.label}</th>`).join('');\n\n  // --- inflow / new / reservation table ---\n  const inflowRowDef = [];\n  INFLOW_CATS.forEach(cat => {\n    inflowRowDef.push({ label: cat.label.split('\uff08')[0], cat: cat.key, sym: 'total', head: true });\n    if (cat.symptoms) {\n      cat.symptoms.forEach(sk => inflowRowDef.push({ label: '\u3000' + SYMPTOM_LABELS[sk], cat: cat.key, sym: sk, head: false }));\n    }\n  });\n  const inflowRows = inflowRowDef.map(r => {\n    const cells = cols.map(c => {\n      const v = m.inflow[r.cat][r.sym][c.key] || 0;\n      const nv = m.newCount[r.cat][r.sym][c.key] || 0;\n      return `<td>${fmt(v)}\u4ef6 / \u65b0\u898f${fmt(nv)}\u4ef6</td>`;\n    }).join('');\n    return `<tr${r.head ? ' class=\"grp-row\"' : ''}><td>${r.label}</td>${cells}</tr>`;\n  }).join('');\n  const inflowTotalRow = `<tr class=\"total-row\"><td>\u7dcf\u6d41\u5165\u8a08</td>${cols.map(c => `<td>${fmt(m.inflow.total[c.key])}\u4ef6 / \u65b0\u898f${fmt(m.newCount.total[c.key])}\u4ef6</td>`).join('')}</tr>`;\n\n  const reservationRows = `\n    <tr><td>\u75c5\u614b\u3042\u308a</td>${cols.map(c => `<td>${fmt(m.reservation.byoutai_ari[c.key])}\u4ef6\uff08${pct((m.reservationRatio.byoutai_ari[c.key]||0)*100)}\uff09</td>`).join('')}</tr>\n    <tr><td>\u30ad\u30e3\u30ea\u30a2</td>${cols.map(c => `<td>${fmt(m.reservation.carrier[c.key])}\u4ef6\uff08${pct((m.reservationRatio.carrier[c.key]||0)*100)}\uff09</td>`).join('')}</tr>\n    <tr class=\"total-row\"><td>\u4e88\u7d04\u8a08</td>${cols.map(c => `<td>${fmt(m.reservation.total[c.key])}\u4ef6</td>`).join('')}</tr>\n  `;\n\n  // --- symptom cross table (existing) ---\n  const bodyRows = GROUPS.map(g => {\n    const groupHead = g.name\n      ? `<tr class=\"grp-row\"><td>${g.name}</td>${cols.map(() => '<td></td>').join('')}</tr>`\n      : '';\n    const itemRows = g.items.map(it => {\n      const cells = cols.map(c => `<td>${fmt(m.items[it.key][c.key] || 0)}</td>`).join('');\n      return `<tr><td>${it.name}</td>${cells}</tr>`;\n    }).join('');\n    return groupHead + itemRows;\n  }).join('');\n  const totalRow = `\n    <tr class=\"total-row\">\n      <td>\u5408\u8a08</td>\n      ${cols.map(c => `<td>${fmt(entityTotal(m, c.key))}</td>`).join('')}\n    </tr>\n  `;\n  const highzoneRow = `\n    <tr class=\"highzone-row\">\n      <td>\u9ad8\u984d\u30be\u30fc\u30f3\u6bd4\u7387</td>\n      ${cols.map(c => {\n        const hz = highzoneCount(m, c.key);\n        const total = entityTotal(m, c.key);\n        const ratio = total ? (hz / total) * 100 : 0;\n        return `<td>${fmt(hz)}\u4ef6\uff08${pct(ratio)}\uff09</td>`;\n      }).join('')}\n    </tr>\n  `;\n\n  const roasRows = cols.map(c => {\n    const ad = m.adSpend[c.key];\n    const rev = m.revenue[c.key];\n    if (!ad) {\n      return `<tr><td>${c.label}</td><td class=\"na\">\u5e83\u544a\u8cbb\u306a\u3057</td><td>${fmtYen(rev)}</td><td class=\"na\">\uff0d</td></tr>`;\n    }\n    const roas = (rev / ad) * 100;\n    const cls = roas >= 250 ? 'roas-good' : (roas < 150 ? 'roas-bad' : '');\n    return `<tr><td>${c.label}</td><td>${fmtYen(ad)}</td><td>${fmtYen(rev)}</td><td class=\"${cls}\">${pct(roas)}</td></tr>`;\n  }).join('');\n\n  const priceRows = GROUPS.flatMap(g => g.items).map(it =>\n    `<tr><td>${it.name}</td><td>${fmtYen(PRICES[it.key])}</td></tr>`\n  ).join('');\n\n  el.innerHTML = `\n    <div class=\"table-block\">\n      <h3>\u6d41\u5165\u30fb\u5bfe\u5fdc\u53ef\u80fd\u65b0\u898f\u6570 \u30af\u30ed\u30b9\u96c6\u8a08\uff08${MONTHS[selectedMonthIndex].label}\uff09</h3>\n      <table class=\"data-table\">\n        <thead><tr><th>\u533a\u5206</th>${headCols}</tr></thead>\n        <tbody>${inflowRows}${inflowTotalRow}</tbody>\n      </table>\n      <p class=\"note\">\u5404\u30bb\u30eb\u306f\u300c\u7dcf\u6d41\u5165\u4ef6\u6570 / \u5bfe\u5fdc\u53ef\u80fd\u65b0\u898f\u6570\u300d\u3002\u3042\u308a\u306a\u3057\uff08\u30ad\u30e3\u30ea\u30a2\uff09\u306f\u533a\u5206\u81ea\u4f53\u304c\u30ad\u30e3\u30ea\u30a2\u306e\u307f\u306e\u305f\u3081\u3001\u30b5\u30d6\u5185\u8a33\u306f\u3042\u308a\u307e\u305b\u3093\u3002</p>\n    </div>\n    <div class=\"table-block\">\n      <h3>\u4e88\u7d04\u6570 \u30af\u30ed\u30b9\u96c6\u8a08\uff08${MONTHS[selectedMonthIndex].label}\uff09</h3>\n      <table class=\"data-table\">\n        <thead><tr><th>\u533a\u5206</th>${headCols}</tr></thead>\n        <tbody>${reservationRows}</tbody>\n      </table>\n      <p class=\"note\">\uff08\u3000\uff09\u5185\u306f\u5404\u7d4c\u8def\u5408\u8a08\u306b\u5bfe\u3059\u308b\u4e88\u7d04\u69cb\u6210\u6bd4\u7387\u3002</p>\n    </div>\n    <div class=\"table-block\">\n      <h3>\u75c7\u72b6 \u00d7 \u6d41\u5165\u7d4c\u8def \u30af\u30ed\u30b9\u96c6\u8a08\uff08\u53d7\u4efb\u6570\u30fb${MONTHS[selectedMonthIndex].label}\uff09</h3>\n      <table class=\"data-table\">\n        <thead><tr><th>\u75c7\u72b6</th>${headCols}</tr></thead>\n        <tbody>${bodyRows}${totalRow}${highzoneRow}</tbody>\n      </table>\n      <p class=\"note\">\u9ad8\u984d\u30be\u30fc\u30f3\u6bd4\u7387\uff1d${HIGHZONE_LABEL}\u306e\u53d7\u4efb\u4ef6\u6570 \u00f7 \u305d\u306e\u7d4c\u8def\u306e\u53d7\u4efb\u4ef6\u6570\u5408\u8a08\u3002</p>\n    </div>\n    <div class=\"table-block\">\n      <h3>\u6d41\u5165\u7d4c\u8def\u5225 \u5e83\u544a\u8cbb\u30fb\u671f\u5f85\u53ce\u76ca\u30fbROAS\uff08${MONTHS[selectedMonthIndex].label}\uff09</h3>\n      <table class=\"data-table\">\n        <thead><tr><th>\u6d41\u5165\u7d4c\u8def</th><th>\u5e83\u544a\u8cbb</th><th>\u671f\u5f85\u53ce\u76ca</th><th>ROAS</th></tr></thead>\n        <tbody>${roasRows}</tbody>\n      </table>\n      <p class=\"note\">\u6570\u5024\u306f\u3054\u63d0\u4f9b\u30c7\u30fc\u30bf\u306e\u5b9f\u7e3e\u5024\u3092\u305d\u306e\u307e\u307e\u4f7f\u7528\u3057\u3066\u3044\u307e\u3059\u3002</p>\n    </div>\n    <div class=\"table-block\">\n      <h3>\u75c7\u72b6\u5225 \u30ea\u30fc\u30b8\u30a7\u30cd\u5358\u4fa1\u8868\uff08\u53c2\u8003\uff09</h3>\n      <table class=\"data-table\">\n        <thead><tr><th>\u75c7\u72b6</th><th>\u5358\u4fa1</th></tr></thead>\n        <tbody>${priceRows}</tbody>\n      </table>\n      <p class=\"note\">\u203b\u3053\u306e\u5358\u4fa1\u306f\u30ea\u30fc\u30c9\uff08\u4ee3\u7406\u5e97\uff09\u7d4c\u7531\u306e\u53d7\u4efb1\u4ef6\u306b\u7528\u3044\u3089\u308c\u308b\u5358\u4fa1\u3067\u3059\u3002\u53c2\u8003\u60c5\u5831\u3067\u3042\u308a\u3001\u4e0a\u8868\u306e\u671f\u5f85\u53ce\u76ca\u306f\u5358\u4fa1\u8868\u304b\u3089\u306e\u9006\u7b97\u5024\u3067\u306f\u306a\u304f\u3001\u3054\u63d0\u4f9b\u30c7\u30fc\u30bf\u306e\u5b9f\u7e3e\u5024\u3092\u4f7f\u7528\u3057\u3066\u3044\u307e\u3059\u3002</p>\n    </div>\n  `;\n}\n\nconst TREND_MONTHS = MONTHS.filter(mo => mo.key !== '11\u6708');\n\nfunction renderTrendChart(chartElId, legendElId, metricFn) {\n  const W = 1000, H = 280;\n  const padL = 56, padR = 40, padT = 16, padB = 28;\n  const plotW = W - padL - padR;\n  const plotH = H - padT - padB;\n\n  const series = ENTITIES.map(ent => ({\n    ent,\n    values: TREND_MONTHS.map(mo => metricFn(MONTH_DATA[mo.key], ent.key) || 0),\n  }));\n  const maxVal = Math.max(...series.flatMap(s => s.values), 1);\n  const niceMax = Math.ceil(maxVal / 100) * 100 || 1;\n\n  const n = TREND_MONTHS.length;\n  const xAt = i => padL + (n > 1 ? (i / (n - 1)) * plotW : plotW / 2);\n  const yAt = v => padT + plotH - (niceMax ? (Math.max(0, v) / niceMax) * plotH : 0);\n\n  const gridCount = 4;\n  const gridLines = Array.from({ length: gridCount + 1 }, (_, i) => {\n    const v = niceMax * i / gridCount;\n    const y = yAt(v);\n    return `<line class=\"grid-line\" x1=\"${padL}\" y1=\"${y}\" x2=\"${W - padR}\" y2=\"${y}\"></line>\n            <text x=\"${padL - 8}\" y=\"${y + 3}\" text-anchor=\"end\">${fmt(v)}</text>`;\n  }).join('');\n\n  const xLabels = TREND_MONTHS.map((mo, i) => `<text x=\"${xAt(i)}\" y=\"${H - padB + 16}\" text-anchor=\"middle\"${mo.note ? ' fill=\"var(--warning)\" font-weight=\"700\"' : ''}>${mo.key}</text>`).join('');\n\n  const lines = series.map(s => {\n    const pts = s.values.map((v, i) => `${xAt(i)},${yAt(v)}`).join(' ');\n    const dots = s.values.map((v, i) => `<circle class=\"series-dot\" cx=\"${xAt(i)}\" cy=\"${yAt(v)}\" r=\"3.5\" fill=\"${s.ent.color}\"><title>${TREND_MONTHS[i].label}\u3000${s.ent.label}\uff1a${fmt(v)}\u4ef6</title></circle>`).join('');\n    return `<polyline class=\"series-line\" points=\"${pts}\" stroke=\"${s.ent.color}\"></polyline>${dots}`;\n  }).join('');\n\n  document.getElementById(chartElId).innerHTML = `\n    <svg class=\"trend-chart\" viewBox=\"0 0 ${W} ${H}\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\">\n      <line class=\"axis-line\" x1=\"${padL}\" y1=\"${H - padB}\" x2=\"${W - padR}\" y2=\"${H - padB}\"></line>\n      ${gridLines}\n      ${xLabels}\n      ${lines}\n    </svg>\n  `;\n  document.getElementById(legendElId).innerHTML = `\n    <div class=\"trend-legend\">\n      ${ENTITIES.map(ent => `<div class=\"item\"><span class=\"swatch\" style=\"background:${ent.color}\"></span>${ent.label}</div>`).join('')}\n    </div>\n  `;\n}\n\nfunction renderTrendCharts() {\n  renderTrendChart('trend-chart-inflow', 'trend-legend-inflow', (m, ch) => m.inflow.total[ch]);\n  renderTrendChart('trend-chart-new', 'trend-legend-new', (m, ch) => m.newCount.total[ch]);\n}\n\nfunction renderAll() {\n  renderMonthButtons();\n  renderPeriodNote();\n  renderKpis();\n  renderEntityToggle();\n  renderInflowBreakdown();\n  renderNewCountBreakdown();\n  renderCallBreakdown();\n  renderReservation();\n  renderRoas();\n  renderBreakdown();\n  renderHighzone();\n  renderSymptomRateBreakdown();\n  renderTables();\n  updateHeaderH();\n}\n\ndocument.getElementById('table-toggle').addEventListener('click', function () {\n  const t = document.getElementById('tables');\n  t.hidden = !t.hidden;\n  this.textContent = (t.hidden ? '\uff0b ' : '\uff0d ') + '\u8a73\u7d30\u30af\u30ed\u30b9\u96c6\u8a08\u3092\u8868\u793a\uff08\u6d41\u5165\u30fb\u65b0\u898f\u30fb\u4e88\u7d04\u30fb\u75c7\u72b6\u5225\u30fb\u5e83\u544a\u8cbb\u5bfe\u52b9\u679c\uff09';\n});\n\nfunction updateHeaderH() {\n  const h = document.getElementById('app-header');\n  if (h) document.documentElement.style.setProperty('--header-h', h.offsetHeight + 'px');\n}\nwindow.addEventListener('resize', updateHeaderH);\n\nfunction scrollToSection(targetId) {\n  const target = document.getElementById(targetId);\n  if (!target) return;\n  const header = document.getElementById('app-header');\n  const entityBar = document.querySelector('.entity-sticky-bar');\n  const offset = (header ? header.offsetHeight : 0) + (entityBar ? entityBar.offsetHeight : 0) + 12;\n  const top = window.scrollY + target.getBoundingClientRect().top - offset;\n  window.scrollTo({ top, behavior: 'smooth' });\n}\n\ndocument.querySelectorAll('.jump-btn').forEach(btn => {\n  btn.addEventListener('click', () => scrollToSection(btn.dataset.target));\n});\n\nrenderAll();\nrenderTrendCharts();\n<\/script>\n\n</body>\n</html>\n";
  const KAJI_HTML = "<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>\u5bb6\u4e8b\u3000\u30ea\u30fc\u30c9\u8a73\u7d30\u5206\u6790</title>\n<style>\n  :root {\n    color-scheme: light;\n    --surface-1:    #fcfcfb;\n    --surface-2:    #f9f9f7;\n    --surface-card: #ffffff;\n    --text-primary:   #0b0b0b;\n    --text-secondary: #52514e;\n    --text-muted:     #898781;\n    --grid:      #e1e0d9;\n    --baseline:  #c3c2b7;\n    --border:    rgba(11,11,11,0.10);\n\n    --s0: #898781; /* neutral (\u30ea\u30fc\u30c9\u5408\u8a08) */\n    --s1: #2a78d6; /* blue (\u30a2\u30b7\u30ed\u30ea\u30fc\u30c9) */\n    --s2: #eb6834; /* orange (\u30c0\u30d6\u30eb\u30ea\u30b9\u30c6\u30a3\u30f3\u30b0) */\n    --s3: #1baf7a; /* aqua (\u30aa\u30fc\u30ac\u30cb\u30c3\u30af\u30ea\u30fc\u30c9) */\n\n    --good:     #0ca30c;\n    --warning:  #fab219;\n    --critical: #d03b3b;\n\n    --lane-bg: #f0efec;\n  }\n  @media (prefers-color-scheme: dark) {\n    :root:not([data-theme=\"light\"]) {\n      color-scheme: dark;\n      --surface-1:    #1a1a19;\n      --surface-2:    #0d0d0d;\n      --surface-card: #232322;\n      --text-primary:   #ffffff;\n      --text-secondary: #c3c2b7;\n      --text-muted:     #898781;\n      --grid:      #2c2c2a;\n      --baseline:  #383835;\n      --border:    rgba(255,255,255,0.10);\n\n      --s0: #898781;\n      --s1: #3987e5;\n      --s2: #d95926;\n      --s3: #199e70;\n\n      --lane-bg: #2c2c2a;\n    }\n  }\n  :root[data-theme=\"dark\"] {\n    color-scheme: dark;\n    --surface-1:    #1a1a19;\n    --surface-2:    #0d0d0d;\n    --surface-card: #232322;\n    --text-primary:   #ffffff;\n    --text-secondary: #c3c2b7;\n    --text-muted:     #898781;\n    --grid:      #2c2c2a;\n    --baseline:  #383835;\n    --border:    rgba(255,255,255,0.10);\n\n    --s0: #898781;\n    --s1: #3987e5;\n    --s2: #d95926;\n    --s3: #199e70;\n\n    --lane-bg: #2c2c2a;\n  }\n\n  * { f09</span>\n        <span class=\"newrate-hero-value\" style=\"color:${ent.color}\">${pct(targetRate)}</span>\n        <span class=\"newrate-hero-note\">\u8ffd\u5ba2\u5bfe\u8c61\u7387\uff1d\u8ffd\u5ba2\u5bfe\u8c61\u6570 \u00f7 \u7dcf\u6d41\u5165\u4ef6\u6570\u3002\u91cd\u8907\u30fb\u8ffd\u5ba2\u4e0d\u53ef\u3092\u9664\u3044\u305f\u5bfe\u5fdc\u53ef\u80fd\u306a\u65b0\u898f\u554f\u3044\u5408\u308f\u305b\u306e\u6bd4\u7387\u3067\u3059\u3002</span>\n      </div>\n      ${rows.map(r => {\n        const w = maxVal ? Math.max(0, r.value) / maxVal * 100 : 0;\n        return `\n          <div class=\"bar-row\">\n            <div class=\"bar-cat\">${r.label}</div>\n            <div class=\"bar-lane\"><div class=\"bar-fill\" style=\"width:${w}%;background:${ent.color}\"></div></div>\n            <div class=\"bar-figs\"><strong>${fmt(r.value)}</strong>\u4ef6</div>\n          </div>\n        `;\n      }).join('')}\n    </div>\n  `;\n}\n\nfunction renderCallBreakdown() {\n  const m = currentMonthData();\n  const ent = ENTITIES.find(e => e.key === activeEntity);\n  const target = entVal(m, '\u8ffd\u5ba2\u5bfe\u8c61') || 0;\n  const calls = entVal(m, '\u67b6\u96fb\u6570') || 0;\n  const talks = entVal(m, '\u901a\u8a71') || 0;\n  const reserve = entVal(m, '\u30ea\u30fc\u30c9\u4e88\u7d04') || 0;\n  const callRate = entVal(m, '\u67b6\u96fb\u7387');\n  const talkRate = calls ? (talks / calls) * 100 : null;\n  const reserveRate = entVal(m, '\u8ffd\u5ba2\u5bfe\u8c61\u5bfe\u4e88\u7d04\u7387');\n  const reserveRatePct = typeof reserveRate === 'number' ? reserveRate * 100 : null;\n\n  document.getElementById('call-breakdown').innerHTML = `\n    <div class=\"grp\">\n      <div class=\"grp-head\"><span>\u67b6\u96fb\u6570\u30fb\u901a\u8a71\u6570\u30fb\u4e88\u7d04\u6570</span></div>\n      <div class=\"roas-row\">\n        <div class=\"roas-tile\">\n          <div class=\"roas-label\">\u67b6\u96fb\u6570</div>\n          <div class=\"roas-value\">${fmt(calls)}\u4ef6</div>\n          <div class=\"roas-rate-note\" style=\"color:${ent.color}\">\u67b6\u96fb\u7387 ${pct(callRate)}</div>\n          <div class=\"roas-note\">\u67b6\u96fb\u7387\uff1d\u67b6\u96fb\u6570 \u00f7 \u8ffd\u5ba2\u5bfe\u8c61\u6570</div>\n        </div>\n        <div class=\"roas-tile\">\n          <div class=\"roas-label\">\u901a\u8a71\u6570</div>\n          <div class=\"roas-value\">${fmt(talks)}\u4ef6</div>\n          <div class=\"roas-rate-note\" style=\"color:${ent.color}\">\u901a\u8a71\u7387 ${pct(talkRate)}</div>\n          <div class=\"roas-note\">\u901a\u8a71\u7387\uff1d\u901a\u8a71\u6570 \u00f7 \u67b6\u96fb\u6570</div>\n        </div>\n        <div class=\"roas-tile\">\n          <div class=\"roas-label\">\u30ea\u30fc\u30c9\u4e88\u7d04\u6570</div>\n          <div class=\"roas-value\">${fmt(reserve)}\u4ef6</div>\n          <div class=\"roas-rate-note\" style=\"color:${ent.color}\">\u4e88\u7d04\u7387 ${pct(reserveRatePct)}</div>\n          <div class=\"roas-note\">\u4e88\u7d04\u7387\uff1d\u4e88\u7d04\u6570 \u00f7 \u8ffd\u5ba2\u5bfe\u8c61\u6570</div>\n        </div>\n      </div>\n    </div>\n  `;\n}\n\nfunction renderRoas() {\n  const m = currentMonthData();\n  const el = document.getElementById('roas-row');\n  const ent = ENTITIES.find(e => e.key === activeEntity);\n  const adSpend = entVal(m, '\u5e83\u544a\u8cbb');\n  const revenue = entVal(m, '\u53d7\u4efb\u671f\u5f85\u53ce\u76ca');\n\n  if (!adSpend) {\n    el.innerHTML = `<p class=\"roas-note-box\">${ent.label}\u306f\u5e83\u544a\u8cbb\u3092\u304b\u3051\u3066\u3044\u306a\u3044\u6d41\u5165\u7d4c\u8def\u306e\u305f\u3081\u3001\u5e83\u544a\u8cbb\u30fbROAS\u306e\u7b97\u51fa\u5bfe\u8c61\u5916\u3067\u3059\uff08\u671f\u5f85\u53ce\u76ca\uff1a<strong>${fmtYen(revenue)}</strong>\uff09\u3002</p>`;\n    return;\n  }\n  const roas = (revenue / adSpend) * 100;\n  const roasClass = roas >= 250 ? 'style=\"color:var(--good)\"' : (roas < 150 ? 'style=\"color:var(--critical)\"' : '');\n  el.innerHTML = `\n    <div class=\"roas-row\">\n      <div class=\"roas-tile\">\n        <div class=\"roas-label\">\u5e83\u544a\u8cbb</div>\n        <div class=\"roas-value\">${fmtYen(adSpend)}</div>\n      </div>\n      <div class=\"roas-tile\">\n        <div class=\"roas-label\">\u671f\u5f85\u53ce\u76ca</div>\n        <div class=\"roas-value\">${fmtYen(revenue)}</div>\n      </div>\n      <div class=\"roas-tile\">\n        <div class=\"roas-label\">ROAS\uff08\u671f\u5f85\u53ce\u76ca \u00f7 \u5e83\u544a\u8cbb\uff09</div>\n        <div class=\"roas-value\" ${roasClass}>${pct(roas)}</div>\n        <div class=\"roas-note\">\u76ee\u5b89\uff1a250%\u4ee5\u4e0a=\u826f\u597d\uff0f150%\u672a\u6e80=\u8981\u6ce8\u610f</div>\n      </div>\n    </div>\n  `;\n}\n\nfunction renderAcceptanceBreakdown() {\n  const m = currentMonthData();\n  const ent = ENTITIES.find(e => e.key === activeEntity);\n  const meetings = entVal(m, '\u9762\u8ac7\u5b9f\u65bd') || 0;\n  const accepted = entVal(m, '\u53d7\u4efb') || 0;\n  const notAccepted = entVal(m, '\u672a\u53d7\u4efb') || 0;\n  const cancel = entVal(m, '\u30ad\u30e3\u30f3\u30bb\u30eb') || 0;\n  const acceptRateRaw = entVal(m, '\u9762\u8ac7\u5b9f\u65bd\u5bfe\u53d7\u4efb\u7387');\n  const acceptRate = typeof acceptRateRaw === 'number' ? acceptRateRaw * 100 : null;\n  const maxVal = meetings || 1;\n\n  const rows = [\n    { label: '\u9762\u8ac7\u5b9f\u65bd', value: meetings },\n    { label: '\u53d7\u4efb', value: accepted },\n    { label: '\u672a\u53d7\u4efb', value: notAccepted },\n    { label: '\u30ad\u30e3\u30f3\u30bb\u30eb', value: cancel },\n  ];\n\n  document.getElementById('acceptance-breakdown').innerHTML = `\n    <div class=\"grp\">\n      <div class=\"grp-head\"><span>\u9762\u8ac7\u301c\u53d7\u4efb</span><span class=\"grp-sub\">\u8a08 ${fmt(meetings)}\u4ef6</span></div>\n      <div class=\"newrate-hero\">\n        <span class=\"newrate-hero-label\">\u53d7\u4efb\u7387\uff08\u5bfe\u9762\u8ac7\u5b9f\u65bd\uff09</span>\n        <span class=\"newrate-hero-value\" style=\"color:${ent.color}\">${pct(acceptRate)}</span>\n        <span class=\"newrate-hero-note\">\u53d7\u4efb\u7387\uff1d\u53d7\u4efb\u6570 \u00f7 \u9762\u8ac7\u5b9f\u65bd\u6570\u3002\u3044\u305f\u3060\u3044\u305f\u30c7\u30fc\u30bf\u306e\u5b9f\u7e3e\u5024\u304b\u3089\u7b97\u51fa\u3057\u3066\u3044\u307e\u3059\u3002</span>\n      </div>\n      ${rows.map(r => {\n        const w = maxVal ? Math.max(0, r.value) / maxVal * 100 : 0;\n        return `\n          <div class=\"bar-row\">\n            <div class=\"bar-cat\">${r.label}</div>\n            <div class=\"bar-lane\"><div class=\"bar-fill\" style=\"width:${w}%;background:${ent.color}\"></div></div>\n            <div class=\"bar-figs\"><strong>${fmt(r.value)}</strong>\u4ef6</div>\n          </div>\n        `;\n      }).join('')}\n    </div>\n  `;\n}\n\nfunction renderTrendChart(chartElId, legendElId, field) {\n  const W = 1000, H = 280;\n  const padL = 56, padR = 40, padT = 16, padB = 28;\n  const plotW = W - padL - padR;\n  const plotH = H - padT - padB;\n\n  const series = ENTITIES.map(ent => ({\n    ent,\n    values: MONTHS.map(mo => (MONTH_DATA[mo.key][ent.key] ? MONTH_DATA[mo.key][ent.key][field] : 0) || 0),\n  }));\n  const maxVal = Math.max(...series.flatMap(s => s.values), 1);\n  const niceMax = Math.ceil(maxVal / 100) * 100 || 1;\n\n  const n = MONTHS.length;\n  const xAt = i => padL + (n > 1 ? (i / (n - 1)) * plotW : plotW / 2);\n  const yAt = v => padT + plotH - (niceMax ? (Math.max(0, v) / niceMax) * plotH : 0);\n\n  const gridCount = 4;\n  const gridLines = Array.from({ length: gridCount + 1 }, (_, i) => {\n    const v = niceMax * i / gridCount;\n    const y = yAt(v);\n    return `<line class=\"grid-line\" x1=\"${padL}\" y1=\"${y}\" x2=\"${W - padR}\" y2=\"${y}\"></line>\n            <text x=\"${padL - 8}\" y=\"${y + 3}\" text-anchor=\"end\">${fmt(v)}</text>`;\n  }).join('');\n\n  const xLabels = MONTHS.map((mo, i) => `<text x=\"${xAt(i)}\" y=\"${H - padB + 16}\" text-anchor=\"middle\">${mo.key}</text>`).join('');\n\n  const lines = series.map(s => {\n    const pts = s.values.map((v, i) => `${xAt(i)},${yAt(v)}`).join(' ');\n    const dots = s.values.map((v, i) => `<circle class=\"series-dot\" cx=\"${xAt(i)}\" cy=\"${yAt(v)}\" r=\"3.5\" fill=\"${s.ent.color}\"><title>${MONTHS[i].label}\u3000${s.ent.label}\uff1a${fmt(v)}\u4ef6</title></circle>`).join('');\n    return `<polyline class=\"series-line\" points=\"${pts}\" stroke=\"${s.ent.color}\"></polyline>${dots}`;\n  }).join('');\n\n  document.getElementById(chartElId).innerHTML = `\n    <svg class=\"trend-chart\" viewBox=\"0 0 ${W} ${H}\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\">\n      <line class=\"axis-line\" x1=\"${padL}\" y1=\"${H - padB}\" x2=\"${W - padR}\" y2=\"${H - padB}\"></line>\n      ${gridLines}\n      ${xLabels}\n      ${lines}\n    </svg>\n  `;\n  document.getElementById(legendElId).innerHTML = `\n    <div class=\"trend-legend\">\n      ${ENTITIES.map(ent => `<div class=\"item\"><span class=\"swatch\" style=\"background:${ent.color}\"></span>${ent.label}</div>`).join('')}\n    </div>\n  `;\n}\n\nfunction renderTrendCharts() {\n  renderTrendChart('trend-chart-inflow', 'trend-legend-inflow', '\u7dcf\u6d41\u5165');\n  renderTrendChart('trend-chart-target', 'trend-legend-target', '\u8ffd\u5ba2\u5bfe\u8c61');\n}\n\nfunction renderTables() {\n  const m = currentMonthData();\n  const el = document.getElementById('tables');\n  const cols = ENTITIES;\n  const headCols = cols.map(c => `<th>${c.label}</th>`).join('');\n\n  const funnelRows = [\n    ['\u7dcf\u6d41\u5165', v => fmt(v.\u7dcf\u6d41\u5165)],\n    ['\u8ffd\u5ba2\u4e0d\u53ef', v => fmt(v.\u8ffd\u5ba2\u4e0d\u53ef)],\n    ['\u8ffd\u5ba2\u5bfe\u8c61', v => fmt(v.\u8ffd\u5ba2\u5bfe\u8c61)],\n    ['\u67b6\u96fb\u6570', v => fmt(v.\u67b6\u96fb\u6570)],\n    ['\u67b6\u96fb\u7387', v => pct(v.\u67b6\u96fb\u7387)],\n    ['\u901a\u8a71', v => fmt(v.\u901a\u8a71)],\n    ['\u9023\u7d61\u4e0d\u901a', v => fmt(v.\u9023\u7d61\u4e0d\u901a)],\n    ['\u30ea\u30fc\u30c9\u4e88\u7d04', v => fmt(v.\u30ea\u30fc\u30c9\u4e88\u7d04)],\n    ['\u9762\u8ac7\u5b9f\u65bd', v => fmt(v.\u9762\u8ac7\u5b9f\u65bd)],\n    ['\u53d7\u4efb', v => fmt(v.\u53d7\u4efb)],\n    ['\u672a\u53d7\u4efb', v => fmt(v.\u672a\u53d7\u4efb)],\n    ['\u30ad\u30e3\u30f3\u30bb\u30eb', v => fmt(v.\u30ad\u30e3\u30f3\u30bb\u30eb)],\n    ['\u5e83\u544a\u8cbb', v => fmtYen(v.\u5e83\u544a\u8cbb)],\n    ['\u53d7\u4efb\u671f\u5f85\u53ce\u76ca', v => fmtYen(v.\u53d7\u4efb\u671f\u5f85\u53ce\u76ca)],\n    ['\u53d7\u4efbROAS', v => pct(v.\u53d7\u4efbROAS)],\n  ];\n  const funnelBody = funnelRows.map(([label, f]) => {\n    const cells = cols.map(c => `<td>${m[c.key] ? f(m[c.key]) : '<span class=\"na\">\u2014</span>'}</td>`).join('');\n    return `<tr><td>${label}</td>${cells}</tr>`;\n  }).join('');\n\n  const rateRows = [\n    ['\u8ffd\u5ba2\u5bfe\u8c61 \u5bfe \u901a\u8a71 \u7387', v => pct(v.\u8ffd\u5ba2\u5bfe\u8c61\u5bfe\u901a\u8a71\u7387 * 100)],\n    ['\u901a\u8a71 \u5bfe \u4e88\u7d04 \u7387', v => pct(v.\u901a\u8a71\u5bfe\u4e88\u7d04\u7387 * 100)],\n    ['\u9762\u8ac7\u5b9f\u65bd \u5bfe \u53d7\u4efb \u7387', v => pct(v.\u9762\u8ac7\u5b9f\u65bd\u5bfe\u53d7\u4efb\u7387 * 100)],\n    ['\u8ffd\u5ba2\u5bfe\u8c61 \u5bfe \u4e88\u7d04 \u7387', v => pct(v.\u8ffd\u5ba2\u5bfe\u8c61\u5bfe\u4e88\u7d04\u7387 * 100)],\n    ['\u8ffd\u5ba2\u5bfe\u8c61 \u5bfe \u53d7\u4efb \u7387', v => pct(v.\u8ffd\u5ba2\u5bfe\u8c61\u5bfe\u53d7\u4efb\u7387 * 100)],\n  ];\n  const rateBody = rateRows.map(([label, f]) => {\n    const cells = cols.map(c => `<td>${m[c.key] ? f(m[c.key]) : '<span class=\"na\">\u2014</span>'}</td>`).join('');\n    return `<tr><td>${label}</td>${cells}</tr>`;\n  }).join('');\n\n  const contractRows = [\n    ['\u5951\u7d04\u6570', v => fmt(v.\u5951\u7d04\u6570)],\n    ['\u5951\u7d04\u671f\u5f85\u53ce\u76ca', v => fmtYen(v.\u5951\u7d04\u671f\u5f85\u53ce\u76ca)],\n    ['\u5951\u7d04ROAS', v => pct(v.\u5951\u7d04ROAS)],\n  ];\n  const contractBody = contractRows.map(([label, f]) => {\n    const cells = cols.map(c => `<td>${m[c.key] ? f(m[c.key]) : '<span class=\"na\">\u2014</span>'}</td>`).join('');\n    return `<tr><td>${label}</td>${cells}</tr>`;\n  }).join('');\n\n  el.innerHTML = `\n    <div class=\"table-block\">\n      <h3>\u30d5\u30a1\u30cd\u30eb\u5b9f\u7e3e \u30af\u30ed\u30b9\u96c6\u8a08\uff08${MONTHS[selectedMonthIndex].label}\uff09</h3>\n      <table class=\"data-table\">\n        <thead><tr><th>\u9805\u76ee</th>${headCols}</tr></thead>\n        <tbody>${funnelBody}</tbody>\n      </table>\n      <p class=\"note\">\u6570\u5024\u306f\u3054\u63d0\u4f9b\u30c7\u30fc\u30bf\u306e\u5b9f\u7e3e\u5024\u3092\u305d\u306e\u307e\u307e\u4f7f\u7528\u3057\u3066\u3044\u307e\u3059\u3002</p>\n    </div>\n    <div class=\"table-block\">\n      <h3>\u7387\u30b5\u30de\u30ea\u30fc\uff08${MONTHS[selectedMonthIndex].label}\uff09</h3>\n      <table class=\"data-table\">\n        <thead><tr><th>\u9805\u76ee</th>${headCols}</tr></thead>\n        <tbody>${rateBody}</tbody>\n      </table>\n    </div>\n    <div class=\"table-block\">\n      <h3>\u5951\u7d04\u5b9f\u7e3e\uff08\u53c2\u8003\u30fb${MONTHS[selectedMonthIndex].label}\uff09</h3>\n      <table class=\"data-table\">\n        <thead><tr><th>\u9805\u76ee</th>${headCols}</tr></thead>\n        <tbody>${contractBody}</tbody>\n      </table>\n      <p class=\"note\">\u203b\u5951\u7d04\u6570\u306f\u53d7\u4efb\u5f8c\u306b\u6b63\u5f0f\u5951\u7d04\u306b\u81f3\u3063\u305f\u4ef6\u6570\u3067\u3001\u53d7\u4efb\u6570\u3068\u306f\u5225\u96c6\u8a08\u3067\u3059\u3002\u5951\u7d04ROAS\uff1d\u5951\u7d04\u671f\u5f85\u53ce\u76ca \u00f7 \u5e83\u544a\u8cbb\u3002</p>\n    </div>\n  `;\n}\n\nfunction renderAll() {\n  renderMonthButtons();\n  renderKpis();\n  renderEntityToggle();\n  renderInflowBreakdown();\n  renderCallBreakdown();\n  renderRoas();\n  renderAcceptanceBreakdown();\n  renderTables();\n  updateHeaderH();\n}\n\ndocument.getElementById('table-toggle').addEventListener('click', function () {\n  const t = document.getElementById('tables');\n  t.hidden = !t.hidden;\n  this.textContent = (t.hidden ? '\uff0b ' : '\uff0d ') + '\u8a73\u7d30\u30af\u30ed\u30b9\u96c6\u8a08\u3092\u8868\u793a\uff08\u30d5\u30a1\u30cd\u30eb\u5168\u4f53\u30fb\u7387\u30b5\u30de\u30ea\u30fc\u30fb\u5951\u7d04\u5b9f\u7e3e\uff09';\n});\n\nfunction updateHeaderH() {\n  const h = document.getElementById('app-header');\n  if (h) document.documentElement.style.setProperty('--header-h', h.offsetHeight + 'px');\n}\nwindow.addEventListener('resize', updateHeaderH);\n\nfunction scrollToSection(targetId) {\n  const target = document.getElementById(targetId);\n  if (!target) return;\n  const header = document.getElementById('app-header');\n  const entityBar = document.querySelector('.entity-sticky-bar');\n  const offset = (header ? header.offsetHeight : 0) + (entityBar ? entityBar.offsetHeight : 0) + 12;\n  const top = window.scrollY + target.getBoundingClientRect().top - offset;\n  window.scrollTo({ top, behavior: 'smooth' });\n}\n\ndocument.querySelectorAll('.jump-btn').forEach(btn => {\n  btn.addEventListener('click', () => scrollToSection(btn.dataset.target));\n});\n\nrenderAll();\nrenderTrendCharts();\n<\/script>\n\n</body>\n</html>\n";

  const frameBkan = document.getElementById('frame-bkan');
  const frameKaji = document.getElementById('frame-kaji');
  const btnBkan = document.getElementById('sw-bkan');
  const btnKaji = document.getElementById('sw-kaji');

  let bkanLoaded = false;
  let kajiLoaded = false;

  function show(which) {
    const isBkan = which === 'bkan';
    if (isBkan && !bkanLoaded) {
      frameBkan.srcdoc = BKAN_HTML;
      bkanLoaded = true;
    }
    if (!isBkan && !kajiLoaded) {
      frameKaji.srcdoc = KAJI_HTML;
      kajiLoaded = true;
    }
    frameBkan.classList.toggle('active', isBkan);
    frameKaji.classList.toggle('active', !isBkan);
    btnBkan.setAttribute('aria-pressed', String(isBkan));
    btnKaji.setAttribute('aria-pressed', String(!isBkan));
  }

  btnBkan.addEventListener('click', () => show('bkan'));
  btnKaji.addEventListener('click', () => show('kaji'));

  show('bkan');
</script>
