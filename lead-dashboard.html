<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リード実績ダッシュボード</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:    #fcfcfb;
    --surface-2:    #f9f9f7;
    --surface-card: #ffffff;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:      #e1e0d9;
    --baseline:  #c3c2b7;
    --border:    rgba(11,11,11,0.10);

    --s1: #2a78d6; /* blue */
    --s2: #eb6834; /* orange */
    --s3: #1baf7a; /* aqua */
    --s4: #eda100; /* yellow */
    --s0: #898781; /* neutral (全体実績) */

    --good:     #0ca30c;
    --warning:  #fab219;
    --critical: #d03b3b;

    --lane-bg: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1:    #1a1a19;
      --surface-2:    #0d0d0d;
      --surface-card: #232322;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:      #2c2c2a;
      --baseline:  #383835;
      --border:    rgba(255,255,255,0.10);

      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
      --s4: #c98500;
      --s0: #898781;

      --lane-bg: #2c2c2a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:    #1a1a19;
    --surface-2:    #0d0d0d;
    --surface-card: #232322;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:      #2c2c2a;
    --baseline:  #383835;
    --border:    rgba(255,255,255,0.10);

    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --s0: #898781;

    --lane-bg: #2c2c2a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-2);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
    padding-bottom: 64px;
  }

  header.top {
    background: var(--surface-card);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header.top h1 {
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0 0 4px;
  }
  header.top p {
    margin: 0 0 12px;
    font-size: .82rem;
    color: var(--text-muted);
  }
  .badge-demo {
    display: inline-block;
    font-size: .68rem;
    font-weight: 700;
    color: var(--s2);
    border: 1px solid var(--s2);
    border-radius: 20px;
    padding: 1px 10px;
    margin-left: 8px;
    vertical-align: middle;
  }

  .month-picker { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .month-picker .mp-label { font-size: .76rem; font-weight: 700; color: var(--text-muted); }
  .month-btn {
    font-family: inherit;
    font-size: .8rem;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .month-btn[aria-pressed="true"] { background: var(--s1); border-color: var(--s1); color: #fff; }

  main { max-width: 1100px; margin: 0 auto; padding: 24px; }

  section.card {
    background: var(--surface-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  section.card h2 {
    font-size: .98rem;
    font-weight: 700;
    margin: 0 0 4px;
  }
  section.card .card-sub {
    font-size: .78rem;
    color: var(--text-muted);
    margin: 0 0 16px;
  }

  /* ---- overview ---- */
  .ov-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }
  .ov-tile {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    cursor: pointer;
    background: var(--surface-1);
    text-align: left;
    font-family: inherit;
    color: inherit;
  }
  .ov-tile:hover { border-color: var(--s1); }
  .ov-tile .ov-name { font-size: .82rem; font-weight: 700; margin-bottom: 6px; }
  .ov-tile .ov-figs { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
  .ov-tile .ov-pct { font-size: 1.5rem; font-weight: 700; }
  .ov-tile .ov-pct-label { font-size: .72rem; color: var(--text-muted); }
  .ov-tile .ov-detail { font-size: .74rem; color: var(--text-secondary); }

  .meter-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .meter-row:last-child { margin-bottom: 0; }
  .meter-label { width: 90px; flex-shrink: 0; font-size: .82rem; font-weight: 600; }
  .meter-track { flex: 1; height: 14px; border-radius: 4px; background: var(--lane-bg); overflow: hidden; }
  .meter-fill { height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; }
  .meter-val { width: 190px; flex-shrink: 0; text-align: right; font-size: .78rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .meter-val strong { color: var(--text-primary); font-weight: 700; }

  /* ---- tabs ---- */
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .tab-btn {
    font-family: inherit;
    font-size: .86rem;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-card);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .tab-btn[aria-selected="true"] {
    background: var(--s1);
    border-color: var(--s1);
    color: #fff;
  }

  .domain-panel[hidden] { display: none; }

  /* ---- KPI tiles ---- */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi-tile { border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .kpi-tile .kpi-label { font-size: .76rem; color: var(--text-muted); margin-bottom: 6px; }
  .kpi-tile .kpi-value { font-size: 1.7rem; font-weight: 700; line-height: 1.1; }
  .kpi-tile .kpi-unit { font-size: .82rem; font-weight: 400; color: var(--text-secondary); margin-left: 2px; }
  .kpi-tile.hero .kpi-value { color: var(--s1); }
  .kpi-tile .kpi-meter { margin-top: 10px; height: 8px; border-radius: 4px; background: var(--lane-bg); overflow: hidden; }
  .kpi-tile .kpi-meter-fill { height: 100%; background: var(--s1); }

  .sub-head { font-size: .78rem; font-weight: 700; color: var(--text-muted); margin: 22px 0 10px; }
  .sub-head:first-of-type { margin-top: 0; }
  .sub-note { font-size: .74rem; color: var(--text-muted); margin: -6px 0 12px; }

  /* ---- rate section ---- */
  .rate-group { margin-bottom: 16px; }
  .rate-group:last-child { margin-bottom: 0; }
  .rate-group-head { display: flex; align-items: baseline; gap: 8px; font-size: .84rem; font-weight: 700; margin-bottom: 8px; }
  .rate-delta { font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 10px; }
  .rate-delta.up { color: var(--good); background: rgba(12,163,12,.12); }
  .rate-delta.down { color: var(--warning); background: rgba(250,178,25,.18); }
  .rate-line { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .rate-line:last-child { margin-bottom: 0; }
  .rate-tag { width: 76px; flex-shrink: 0; font-size: .74rem; font-weight: 700; }
  .rate-track { flex: 1; height: 10px; border-radius: 4px; background: var(--lane-bg); overflow: hidden; }
  .rate-fill { height: 100%; border-radius: 0 4px 4px 0; }
  .rate-val { width: 250px; flex-shrink: 0; text-align: right; font-size: .74rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .rate-val strong { color: var(--text-primary); font-weight: 700; }

  /* ---- agency toggle ---- */
  .agency-toggle { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .agency-btn {
    font-family: inherit;
    font-size: .82rem;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--surface-1);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .agency-btn .swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .agency-btn.all-btn { border-style: dashed; }
  .agency-btn.all-btn .swatch { border-radius: 2px; }
  .agency-btn .cnt { font-variant-numeric: tabular-nums; color: var(--text-muted); }
  .agency-btn[aria-pressed="true"] { border-color: currentColor; border-style: solid; background: var(--surface-card); color: var(--text-primary); box-shadow: 0 0 0 1px currentColor inset; }

  /* ---- composition bar ---- */
  .comp-bar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin-bottom: 10px; background: var(--lane-bg); }
  .comp-seg { height: 100%; transition: opacity .15s; }
  .comp-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 4px; font-size: .78rem; color: var(--text-secondary); }
  .comp-legend .item { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .comp-legend .item .swatch { width: 10px; height: 10px; border-radius: 2px; }
  .comp-legend .item.dim { opacity: .45; }

  /* ---- ROAS row ---- */
  .roas-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 14px 0 4px; }
  .roas-tile { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; background: var(--surface-1); }
  .roas-tile .roas-label { font-size: .72rem; color: var(--text-muted); margin-bottom: 4px; }
  .roas-tile .roas-value { font-size: 1.3rem; font-weight: 700; }
  .roas-tile .roas-note { font-size: .7rem; color: var(--text-muted); margin-top: 2px; }
  .roas-note-box { font-size: .74rem; color: var(--text-muted); margin-bottom: 14px; }

  /* ---- breakdown bars ---- */
  .grp { margin-bottom: 18px; }
  .grp:last-child { margin-bottom: 0; }
  .grp-head { display: flex; justify-content: space-between; align-items: baseline; font-size: .82rem; font-weight: 700; color: var(--text-secondary); border-bottom: 1px solid var(--grid); padding-bottom: 6px; margin-bottom: 10px; }
  .grp-head .grp-sub { font-weight: 400; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-cat { width: 200px; flex-shrink: 0; font-size: .8rem; color: var(--text-primary); }
  .bar-lane { flex: 1; height: 18px; background: var(--lane-bg); border-radius: 4px; position: relative; }
  .bar-fill { height: 100%; border-radius: 0 4px 4px 0; }
  .bar-figs { width: 130px; flex-shrink: 0; text-align: right; font-size: .78rem; font-variant-numeric: tabular-nums; color: var(--text-secondary); }
  .bar-figs strong { color: var(--text-primary); font-weight: 700; }

  /* ---- tables ---- */
  .table-toggle { font-family: inherit; font-size: .8rem; font-weight: 700; color: var(--s1); background: none; border: none; cursor: pointer; padding: 0; margin-top: 18px; }
  .table-block { overflow-x: auto; margin-top: 16px; }
  .table-block h3 { font-size: .82rem; font-weight: 700; margin: 0 0 8px; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  table.data-table th, table.data-table td { padding: 8px 10px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.data-table th:first-child, table.data-table td:first-child { text-align: left; font-variant-numeric: normal; }
  table.data-table thead th { color: var(--text-muted); font-weight: 700; border-bottom: 1px solid var(--baseline); }
  table.data-table tbody tr.grp-row td { background: var(--surface-1); font-weight: 700; color: var(--text-secondary); }
  table.data-table tbody tr.total-row td { font-weight: 700; border-top: 1px solid var(--baseline); border-bottom: none; }
  table.data-table td.roas-good { color: var(--good); font-weight: 700; }
  table.data-table td.roas-bad { color: var(--critical); font-weight: 700; }
  table.data-table td.na { color: var(--text-muted); }

  @media (max-width: 640px) {
    .bar-cat { width: 120px; font-size: .74rem; }
    .bar-figs { width: 96px; }
    .meter-label { width: 68px; }
    .meter-val { width: 130px; }
    .rate-tag { width: 60px; font-size: .68rem; }
    .rate-val { width: 150px; font-size: .68rem; }
  }
</style>
</head>

    nonLeadBase: { seikyu_tandoku: 38, w_seikyu: 14, teisouken: 8, challenge: 12, shomen: 18, hiseikyu: 28, support: 12, rikon: 45, backup: 19, youikuhi: 17, konhi: 9 },
    meetings: {
      '請求': { overallBase: 369, leadBase: 186 },
      '被請求': { overallBase: 138, leadBase: 66 },
      '離婚': { overallBase: 347, leadBase: 174 },
    },
    agencies: [
      { key: 'ashiro', name: 'アシロ', isPaid: true, adSpendBase: 7200000,
        dataBase: { seikyu_tandoku: 12, w_seikyu: 5, teisouken: 3, challenge: 4, shomen: 6, hiseikyu: 9, support: 4, rikon: 15, backup: 7, youikuhi: 5, konhi: 3 } },
      { key: 'naisei', name: '内製', isPaid: true, adSpendBase: 3850000,
        dataBase: { seikyu_tandoku: 6, w_seikyu: 2, teisouken: 1, challenge: 2, shomen: 3, hiseikyu: 5, support: 2, rikon: 8, backup: 3, youikuhi: 3, konhi: 2 } },
      { key: 'organic', name: 'オーガニック', isPaid: false,
        dataBase: { seikyu_tandoku: 9, w_seikyu: 3, teisouken: 2, challenge: 3, shomen: 4, hiseikyu: 6, support: 3, rikon: 10, backup: 4, youikuhi: 4, konhi: 2 } },
    ],
  },
];

const SERIES_COLORS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)'];

const fmt = n => Math.round(n).toLocaleString('ja-JP');
const pct = n => n.toFixed(1) + '%';
const fmtMan = n => fmt(n / 10000) + '万円';

const activeAgencyByDomain = {};
DOMAINS.forEach(d => { activeAgencyByDomain[d.key] = 'ALL'; });
let currentDomainKey = DOMAINS[0].key;
const mdCache = {};

function getDomainMonthData(domain, monthIdx) {
  const mult = MONTHS[monthIdx].m;
  const scale = v => Math.round(v * mult);
  const agencies = domain.agencies.map(ag => {
    const data = {};
    let total = 0, revenue = 0;
    Object.entries(ag.dataBase).forEach(([k, v]) => {
      const val = scale(v);
      data[k] = val;
      total += val;
      revenue += val * (domain.prices[k] || 0);
    });
    const adSpend = ag.isPaid ? scale(ag.adSpendBase) : 0;
    const roas = (ag.isPaid && adSpend > 0) ? (revenue / adSpend) * 100 : null;
    return { key: ag.key, name: ag.name, isPaid: ag.isPaid, data, total, revenue, adSpend, roas };
  });
  const overall = {};
  let overallTotal = 0;
  Object.keys(domain.nonLeadBase).forEach(k => {
    const agencySum = agencies.reduce((s, a) => s + (a.data[k] || 0), 0);
    const val = agencySum + scale(domain.nonLeadBase[k]);
    overall[k] = val;
    overallTotal += val;
  });
  const leadTotal = agencies.reduce((s, a) => s + a.total, 0);
  return { agencies, overall, overallTotal, leadTotal, occupancy: overallTotal ? (leadTotal / overallTotal) * 100 : 0 };
}

function renderMonthButtons() {
  const el = document.getElementById('month-buttons');
  el.innerHTML = '';
  MONTHS.forEach((mo, i) => {
    const btn = document.createElement('button');
    btn.className = 'month-btn';
    btn.textContent = mo.label;
    btn.setAttribute('aria-pressed', i === selectedMonthIndex ? 'true' : 'false');
    btn.addEventListener('click', () => {
      selectedMonthIndex = i;
      renderAll();
    });
    el.appendChild(btn);
  });
}

function renderOverview() {
  const tilesEl = document.getElementById('overview-tiles');
  const metersEl = document.getElementById('overview-meters');
  let officeTotal = 0, officeLead = 0;
  const rows = [];
  DOMAINS.forEach(d => {
    const md = getDomainMonthData(d, selectedMonthIndex);
    officeTotal += md.overallTotal;
    officeLead += md.leadTotal;
    rows.push({ d, md });
  });

  tilesEl.innerHTML = '';
  rows.forEach(({ d, md }) => {
    const btn = document.createElement('button');
    btn.className = 'ov-tile';
    btn.innerHTML = `
      <div class="ov-name">${d.name}</div>
      <div class="ov-figs"><span class="ov-pct">${pct(md.occupancy)}</span><span class="ov-pct-label">占有率</span></div>
      <div class="ov-detail">全体実績 <strong>${fmt(md.overallTotal)}</strong>件 ／ リード実績 <strong>${fmt(md.leadTotal)}</strong>件</div>
    `;
    btn.addEventListener('click', () => selectDomain(d.key, true));
    tilesEl.appendChild(btn);
  });

  const meterRows = [{ label: '全社合計', total: officeTotal, lead: officeLead }]
    .concat(rows.map(({ d, md }) => ({ label: d.name, total: md.overallTotal, lead: md.leadTotal })));

  metersEl.innerHTML = meterRows.map(r => {
    const p = r.total ? (r.lead / r.total) * 100 : 0;
    return `
      <div class="meter-row">
        <div class="meter-label">${r.label}</div>
        <div class="meter-track"><div class="meter-fill" style="width:${p}%"></div></div>
        <div class="meter-val">リード <strong>${fmt(r.lead)}</strong>／全体 ${fmt(r.total)}件（<strong>${pct(p)}</strong>）</div>
      </div>
    `;
  }).join('');
}

function renderTabs() {
  const tabsEl = document.getElementById('domain-tabs');
  tabsEl.innerHTML = '';
  DOMAINS.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.textContent = d.name;
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', d.key === currentDomainKey ? 'true' : 'false');
    btn.dataset.domain = d.key;
    btn.addEventListener('click', () => selectDomain(d.key));
    tabsEl.appendChild(btn);
  });
}

function selectDomain(key, scroll) {
  currentDomainKey = key;
  document.querySelectorAll('#domain-tabs .tab-btn').forEach(b => {
    b.setAttribute('aria-selected', b.dataset.domain === key ? 'true' : 'false');
  });
  document.querySelectorAll('.domain-panel').forEach(p => {
    p.hidden = p.dataset.domain !== key;
  });
  if (scroll) {
    document.getElementById('domain-tabs').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function renderDomainPanels() {
  const wrap = document.getElementById('domain-panels');
  wrap.innerHTML = '';
  DOMAINS.forEach(d => {
    mdCache[d.key] = getDomainMonthData(d, selectedMonthIndex);

    const panel = document.createElement('section');
    panel.className = 'card domain-panel';
    panel.dataset.domain = d.key;
    panel.hidden = d.key !== currentDomainKey;
    panel.innerHTML = `
      <h2>${d.name}　ミクロ分析</h2>
      <p class="card-sub">依頼方針別・リード代理店別の受任実績内訳（${MONTHS[selectedMonthIndex].label}度）。</p>
      <div class="kpi-row" id="kpi-${d.key}"></div>
      <div class="sub-head">受任率（大カテ別・全体実績 vs リード実績）</div>
      <p class="sub-note">受任率 ＝ 受任数 ÷ 面談実施数（仮想データ）。全体実績とリード実績で受任率に差があるかを比較できます。</p>
      <div id="rate-${d.key}"></div>
      <div class="sub-head">リード代理店（「全体実績」で全流入経路の内訳を確認できます）</div>
      <div class="agency-toggle" id="agency-toggle-${d.key}"></div>
      <div class="comp-bar" id="comp-bar-${d.key}"></div>
      <div class="comp-legend" id="comp-legend-${d.key}"></div>
      <div id="roas-${d.key}"></div>
      <div id="breakdown-${d.key}"></div>
      <button class="table-toggle" id="table-toggle-${d.key}">＋ 代理店別クロス集計・広告費対効果を表示</button>
      <div id="tables-${d.key}" hidden></div>
    `;
    wrap.appendChild(panel);

    renderKpis(d);
    renderRateSection(d);
    renderAgencyToggle(d);
    renderComposition(d);
    renderRoasRow(d);
    renderBreakdown(d);
    renderTables(d);

    document.getElementById(`table-toggle-${d.key}`).addEventListener('click', function () {
      const t = document.getElementById(`tables-${d.key}`);
      t.hidden = !t.hidden;
      this.textContent = (t.hidden ? '＋ ' : '－ ') + '代理店別クロス集計・広告費対効果を表示';
    });
  });
}

function renderKpis(d) {
  const md = mdCache[d.key];
  document.getElementById(`kpi-${d.key}`).innerHTML = `
    <div class="kpi-tile">
      <div class="kpi-label">全体実績（全流入経路・受任数）</div>
      <div class="kpi-value">${fmt(md.overallTotal)}<span class="kpi-unit">件</span></div>
    </div>
    <div class="kpi-tile">
      <div class="kpi-label">リード合計実績（受任数）</div>
      <div class="kpi-value">${fmt(md.leadTotal)}<span class="kpi-unit">件</span></div>
    </div>
    <div class="kpi-tile hero">
      <div class="kpi-label">リード占有率</div>
      <div class="kpi-value">${pct(md.occupancy)}</div>
      <div class="kpi-meter"><div class="kpi-meter-fill" style="width:${md.occupancy}%"></div></div>
    </div>
  `;
}

function getMajorCategories(domain) {
  return domain.groups.flatMap(g => g.name
    ? [{ name: g.name, itemKeys: g.items.map(it => it.key) }]
    : g.items.map(it => ({ name: it.name, itemKeys: [it.key] }))
  );
}

function renderRateSection(d) {
  const md = mdCache[d.key];
  const mult = MONTHS[selectedMonthIndex].m;
  const scale = v => Math.round(v * mult);
  const el = document.getElementById(`rate-${d.key}`);
  el.innerHTML = getMajorCategories(d).map(cat => {
    const acceptedOverall = cat.itemKeys.reduce((s, k) => s + (md.overall[k] || 0), 0);
    const acceptedLead = cat.itemKeys.reduce((s, k) => s + md.agencies.reduce((ss, a) => ss + (a.data[k] || 0), 0), 0);
    const mBase = d.meetings[cat.name];
    const meetingsOverall = scale(mBase.overallBase);
    const meetingsLead = scale(mBase.leadBase);
    const rateOverall = meetingsOverall ? (acceptedOverall / meetingsOverall) * 100 : 0;
    const rateLead = meetingsLead ? (acceptedLead / meetingsLead) * 100 : 0;
    const delta = rateLead - rateOverall;
    const deltaCls = delta >= 0 ? 'up' : 'down';
    const deltaSign = delta >= 0 ? '+' : '';
    return `
      <div class="rate-group">
        <div class="rate-group-head">
          <span>${cat.name}</span>
          <span class="rate-delta ${deltaCls}">リード ${deltaSign}${delta.toFixed(1)}pt</span>
        </div>
        <div class="rate-line">
          <span class="rate-tag" style="color:var(--s0)">全体実績</span>
          <div class="rate-track"><div class="rate-fill" style="width:${rateOverall}%;background:var(--s0)"></div></div>
          <div class="rate-val">受任率 <strong>${pct(rateOverall)}</strong>（受任${fmt(acceptedOverall)}／面談${fmt(meetingsOverall)}）</div>
        </div>
        <div class="rate-line">
          <span class="rate-tag" style="color:var(--s1)">リード実績</span>
          <div class="rate-track"><div class="rate-fill" style="width:${rateLead}%;background:var(--s1)"></div></div>
          <div class="rate-val">受任率 <strong>${pct(rateLead)}</strong>（受任${fmt(acceptedLead)}／面談${fmt(meetingsLead)}）</div>
        </div>
      </div>
    `;
  }).join('');
}

function renderAgencyToggle(d) {
  const md = mdCache[d.key];
  const el = document.getElementById(`agency-toggle-${d.key}`);
  el.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'agency-btn all-btn';
  allBtn.style.color = 'var(--s0)';
  allBtn.setAttribute('aria-pressed', activeAgencyByDomain[d.key] === 'ALL' ? 'true' : 'false');
  allBtn.innerHTML = `<span class="swatch" style="background:var(--s0)"></span>全体実績<span class="cnt">${fmt(md.overallTotal)}件</span>`;
  allBtn.addEventListener('click', () => setActiveAgency(d, 'ALL'));
  el.appendChild(allBtn);

  md.agencies.forEach((ag, i) => {
    const btn = document.createElement('button');
    btn.className = 'agency-btn';
    btn.style.color = SERIES_COLORS[i];
    btn.setAttribute('aria-pressed', ag.key === activeAgencyByDomain[d.key] ? 'true' : 'false');
    btn.innerHTML = `<span class="swatch" style="background:${SERIES_COLORS[i]}"></span>${ag.name}<span class="cnt">${fmt(ag.total)}件</span>`;
    btn.addEventListener('click', () => setActiveAgency(d, ag.key));
    el.appendChild(btn);
  });
}

function renderComposition(d) {
  const md = mdCache[d.key];
  const total = md.leadTotal;
  const barEl = document.getElementById(`comp-bar-${d.key}`);
  const legendEl = document.getElementById(`comp-legend-${d.key}`);
  barEl.innerHTML = '';
  legendEl.innerHTML = '';
  md.agencies.forEach((ag, i) => {
    const p = total ? (ag.total / total) * 100 : 0;
    const seg = document.createElement('div');
    seg.className = 'comp-seg';
    seg.style.width = p + '%';
    seg.style.background = SERIES_COLORS[i];
    seg.title = `${ag.name}：${fmt(ag.total)}件（リード内 ${pct(p)}）`;
    seg.dataset.agency = ag.key;
    barEl.appendChild(seg);

    const item = document.createElement('div');
    item.className = 'item';
    item.dataset.agency = ag.key;
    item.innerHTML = `<span class="swatch" style="background:${SERIES_COLORS[i]}"></span>${ag.name}（${pct(p)}）`;
    item.addEventListener('click', () => setActiveAgency(d, ag.key));
    legendEl.appendChild(item);
  });
  updateCompositionHighlight(d);
}

function updateCompositionHighlight(d) {
  const active = activeAgencyByDomain[d.key];
  document.querySelectorAll(`#comp-bar-${d.key} .comp-seg`).forEach(seg => {
    seg.style.opacity = (active === 'ALL' || seg.dataset.agency === active) ? '1' : '.4';
  });
  document.querySelectorAll(`#comp-legend-${d.key} .item`).forEach(item => {
    item.classList.toggle('dim', active !== 'ALL' && item.dataset.agency !== active);
  });
}

function renderRoasRow(d) {
  const el = document.getElementById(`roas-${d.key}`);
  const active = activeAgencyByDomain[d.key];
  if (active === 'ALL') { el.innerHTML = ''; return; }
  const md = mdCache[d.key];
  const ag = md.agencies.find(a => a.key === active);

  if (!ag.isPaid) {
    el.innerHTML = `<p class="roas-note-box">${ag.name}は広告費をかけていない流入経路のため、広告費・ROASの算出対象外です（期待収益（受任ベース）：<strong>${fmtMan(ag.revenue)}</strong>）。</p>`;
    return;
  }
  const roasClass = ag.roas >= 250 ? 'style="color:var(--good)"' : (ag.roas < 150 ? 'style="color:var(--critical)"' : '');
  el.innerHTML = `
    <div class="roas-row">
      <div class="roas-tile">
        <div class="roas-label">広告費</div>
        <div class="roas-value">${fmtMan(ag.adSpend)}</div>
      </div>
      <div class="roas-tile">
        <div class="roas-label">期待収益（受任ベース・仮想単価）</div>
        <div class="roas-value">${fmtMan(ag.revenue)}</div>
      </div>
      <div class="roas-tile">
        <div class="roas-label">ROAS（期待収益 ÷ 広告費）</div>
        <div class="roas-value" ${roasClass}>${pct(ag.roas)}</div>
        <div class="roas-note">目安：250%以上=良好／150%未満=要注意</div>
      </div>
    </div>
  `;
}

function renderBreakdown(d) {
  const md = mdCache[d.key];
  const active = activeAgencyByDomain[d.key];
  const isAll = active === 'ALL';
  const ag = isAll ? null : md.agencies.find(a => a.key === active);
  const agencyIndex = isAll ? -1 : md.agencies.indexOf(ag);
  const color = isAll ? 'var(--s0)' : SERIES_COLORS[agencyIndex];
  const source = isAll ? md.overall : ag.data;
  const denom = isAll ? md.overallTotal : ag.total;
  const maxVal = Math.max(...d.groups.flatMap(g => g.items.map(it => source[it.key] || 0)), 1);

  const el = document.getElementById(`breakdown-${d.key}`);
  el.innerHTML = d.groups.map(g => {
    const groupTotal = g.items.reduce((a, it) => a + (source[it.key] || 0), 0);
    const groupShare = denom ? (groupTotal / denom) * 100 : 0;
    const headHtml = g.name
      ? `<div class="grp-head"><span>${g.name}</span><span class="grp-sub">計 ${fmt(groupTotal)}件（${pct(groupShare)}）</span></div>`
      : '';
    const rows = g.items.map(it => {
      const v = source[it.key] || 0;
      const w = (v / maxVal) * 100;
      const share = denom ? (v / denom) * 100 : 0;
      return `
        <div class="bar-row">
          <div class="bar-cat">${it.name}</div>
          <div class="bar-lane"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div>
          <div class="bar-figs"><strong>${fmt(v)}</strong>件（${pct(share)}）</div>
        </div>
      `;
    }).join('');
    return `<div class="grp">${headHtml}${rows}</div>`;
  }).join('');
}

function renderTables(d) {
  const md = mdCache[d.key];
  const el = document.getElementById(`tables-${d.key}`);

  const headCols = md.agencies.map(a => `<th>${a.name}</th>`).join('');
  const bodyRows = d.groups.map(g => {
    const groupHead = g.name
      ? `<tr class="grp-row"><td>${g.name}</td>${md.agencies.map(() => '<td></td>').join('')}<td></td><td></td></tr>`
      : '';
    const itemRows = g.items.map(it => {
      const cells = md.agencies.map(a => `<td>${fmt(a.data[it.key] || 0)}</td>`).join('');
      const rowTotal = md.agencies.reduce((s, a) => s + (a.data[it.key] || 0), 0);
      return `<tr><td>${it.name}</td>${cells}<td><strong>${fmt(rowTotal)}</strong></td><td>${fmt(md.overall[it.key] || 0)}</td></tr>`;
    }).join('');
    return groupHead + itemRows;
  }).join('');
  const totalRow = `
    <tr class="total-row">
      <td>合計</td>
      ${md.agencies.map(a => `<td>${fmt(a.total)}</td>`).join('')}
      <td>${fmt(md.leadTotal)}</td>
      <td>${fmt(md.overallTotal)}</td>
    </tr>
  `;

  const roasRows = md.agencies.map(a => {
    if (!a.isPaid) {
      return `<tr><td>${a.name}</td><td class="na">広告費なし</td><td>${fmtMan(a.revenue)}</td><td class="na">－</td></tr>`;
    }
    const cls = a.roas >= 250 ? 'roas-good' : (a.roas < 150 ? 'roas-bad' : '');
    return `<tr><td>${a.name}</td><td>${fmtMan(a.adSpend)}</td><td>${fmtMan(a.revenue)}</td><td class="${cls}">${pct(a.roas)}</td></tr>`;
  }).join('');

  el.innerHTML = `
    <div class="table-block">
      <h3>依頼方針 × 代理店 クロス集計（受任数）</h3>
      <table class="data-table">
        <thead><tr><th>依頼方針</th>${headCols}<th>リード計</th><th>全体実績</th></tr></thead>
        <tbody>${bodyRows}${totalRow}</tbody>
      </table>
    </div>
    <div class="table-block">
      <h3>代理店別 広告費・期待収益・ROAS（${MONTHS[selectedMonthIndex].label}度）</h3>
      <table class="data-table">
        <thead><tr><th>代理店</th><th>広告費</th><th>期待収益（受任ベース）</th><th>ROAS</th></tr></thead>
        <tbody>${roasRows}</tbody>
      </table>
    </div>
  `;
}

function setActiveAgency(d, agencyKey) {
  activeAgencyByDomain[d.key] = agencyKey;
  renderAgencyToggle(d);
  updateCompositionHighlight(d);
  renderRoasRow(d);
  renderBreakdown(d);
}

function renderAll() {
  renderMonthButtons();
  renderOverview();
  renderTabs();
  renderDomainPanels();
}

renderAll();
</script>

</body>
</html>
