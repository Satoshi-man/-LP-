<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家事事件 トークスクリプト支援ツール</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1a2b4a;
      --navy-dark: #0f1e35;
      --gold: #c8a951;
      --gold-light: #e8d080;
      --gray-bg: #f5f6f8;
      --text: #2d2d2d;
      --text-light: #666;
      --white: #fff;
      --green: #27ae60;
      --green-light: #eafaf1;
      --blue: #2980b9;
      --blue-light: #ebf5fb;
      --orange: #e67e22;
      --orange-light: #fef5e7;
      --red: #c0392b;
      --border: #dde1e8;
    }

    body {
      font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--text);
      line-height: 1.8;
      font-size: 15px;
      background: var(--gray-bg);
      min-height: 100vh;
    }

    /* Header */
    .app-header {
      background: var(--navy);
      color: var(--white);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    .app-header h1 {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-header .badge {
      background: var(--gold);
      color: var(--navy);
      font-size: .65rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 3px;
      letter-spacing: .05em;
    }

    .app-header .internal {
      font-size: .7rem;
      color: var(--gold-light);
      font-weight: 400;
    }

    /* Layout */
    .app-container {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 0;
      max-width: 1400px;
      margin: 0 auto;
      min-height: calc(100vh - 56px);
    }

    /* Left Panel */
    .input-panel {
      background: var(--white);
      border-right: 1px solid var(--border);
      padding: 24px;
      overflow-y: auto;
      max-height: calc(100vh - 56px);
      position: sticky;
      top: 56px;
    }

    .panel-title {
      font-size: .85rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--gold);
    }

    /* Quick tags */
    .quick-tags {
      margin-bottom: 20px;
    }

    .quick-tags-label {
      font-size: .75rem;
      font-weight: 700;
      color: var(--text-light);
      margin-bottom: 8px;
      letter-spacing: .05em;
    }

    .tag-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-btn {
      background: var(--gray-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: .78rem;
      cursor: pointer;
      transition: all .15s;
      color: var(--text);
      font-family: inherit;
    }

    .tag-btn:hover {
      background: var(--navy);
      color: var(--white);
      border-color: var(--navy);
    }

    .tag-btn.active {
      background: var(--navy);
      color: var(--white);
      border-color: var(--navy);
    }

    /* Memo area */
    .memo-area {
      margin-bottom: 20px;
    }

    .memo-area label {
      display: block;
      font-size: .8rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .memo-area textarea {
      width: 100%;
      height: 120px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-size: .88rem;
      font-family: inherit;
      line-height: 1.7;
      resize: vertical;
      transition: border-color .2s;
    }

    .memo-area textarea:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(200,169,81,.15);
    }

    .memo-area textarea::placeholder {
      color: #aab;
    }

    .char-count {
      text-align: right;
      font-size: .7rem;
      color: var(--text-light);
      margin-top: 4px;
    }

    /* Customer info */
    .customer-info {
      margin-bottom: 20px;
    }

    .info-row {
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
    }

    .info-field {
      flex: 1;
    }

    .info-field label {
      display: block;
      font-size: .75rem;
      font-weight: 600;
      color: var(--text-light);
      margin-bottom: 4px;
    }

    .info-field select,
    .info-field input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: .82rem;
      font-family: inherit;
      background: var(--white);
    }

    .info-field select:focus,
    .info-field input:focus {
      outline: none;
      border-color: var(--gold);
    }

    /* Generate button */
    .generate-btn {
      width: 100%;
      padding: 14px;
      background: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: 6px;
      font-size: .95rem;
      font-weight: 800;
      cursor: pointer;
      transition: opacity .2s;
      font-family: inherit;
      letter-spacing: .03em;
    }

    .generate-btn:hover {
      opacity: .85;
    }

    .generate-btn:active {
      transform: scale(.98);
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn-row .generate-btn {
      flex: 1;
    }

    .clear-btn {
      padding: 14px 20px;
      background: var(--white);
      color: var(--text-light);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .15s;
      font-family: inherit;
      white-space: nowrap;
    }

    .clear-btn:hover {
      background: var(--red);
      color: var(--white);
      border-color: var(--red);
    }

    .clear-btn:active {
      transform: scale(.98);
    }

    /* Right Panel */
    .output-panel {
      padding: 24px 32px;
      overflow-y: auto;
      max-height: calc(100vh - 56px);
    }

    /* Script cards */
    .script-section {
      margin-bottom: 28px;
    }

    .script-section-title {
      font-size: .8rem;
      font-weight: 700;
      color: var(--white);
      background: var(--navy);
      padding: 8px 16px;
      border-radius: 6px 6px 0 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .script-section-title .icon {
      font-size: 1rem;
    }

    .script-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 6px 6px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,.04);
    }

    .script-label {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .1em;
      margin-bottom: 6px;
      padding: 2px 8px;
      border-radius: 3px;
      display: inline-block;
    }

    .label-concern {
      background: #fdecea;
      color: var(--red);
    }

    .label-response {
      background: var(--green-light);
      color: var(--green);
    }

    .label-point {
      background: var(--blue-light);
      color: var(--blue);
    }

    .label-close {
      background: var(--orange-light);
      color: var(--orange);
    }

    .script-text {
      font-size: .9rem;
      line-height: 2;
      color: var(--text);
      margin-bottom: 12px;
    }

    .script-text strong {
      color: var(--navy);
      background: linear-gradient(transparent 60%, rgba(200,169,81,.25) 60%);
    }

    .script-text .emphasis {
      color: var(--red);
      font-weight: 700;
    }

    .script-divider {
      border: none;
      border-top: 1px dashed var(--border);
      margin: 16px 0;
    }

    /* Strength badge */
    .strength-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--gold);
      color: var(--navy);
      font-size: .7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 3px;
      margin: 2px 4px 2px 0;
    }

    /* Tip box */
    .tip-box {
      background: #fffbf0;
      border: 1px solid var(--gold);
      border-left: 4px solid var(--gold);
      border-radius: 0 6px 6px 0;
      padding: 14px 16px;
      margin-top: 12px;
      font-size: .82rem;
      color: var(--text);
    }

    .tip-box-title {
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 4px;
      font-size: .78rem;
    }

    /* Copy button */
    .copy-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 12px;
      font-size: .72rem;
      cursor: pointer;
      color: var(--text-light);
      font-family: inherit;
      transition: all .15s;
      float: right;
    }

    .copy-btn:hover {
      background: var(--navy);
      color: var(--white);
      border-color: var(--navy);
    }

    .copy-btn.copied {
      background: var(--green);
      color: var(--white);
      border-color: var(--green);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 80px 40px;
      color: var(--text-light);
    }

    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: 16px;
      opacity: .4;
    }

    .empty-state h3 {
      font-size: 1.1rem;
      color: var(--navy);
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: .85rem;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .app-container {
        grid-template-columns: 1fr;
      }

      .input-panel {
        position: relative;
        top: 0;
        max-height: none;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .output-panel {
        max-height: none;
      }
    }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .script-section {
      animation: fadeInUp .3s ease-out;
    }

    .script-section:nth-child(2) { animation-delay: .05s; }
    .script-section:nth-child(3) { animation-delay: .1s; }
    .script-section:nth-child(4) { animation-delay: .15s; }
    .script-section:nth-child(5) { animation-delay: .2s; }
  </style>
</head>
<body>

<div class="app-header">
  <h1>
    家事事件 トークスクリプト支援ツール
    <span class="badge">社内用</span>
  </h1>
  <span class="internal">対応者向け支援システム</span>
</div>

<div class="app-container">

  <!-- Left: Input Panel -->
  <div class="input-panel">
    <div class="panel-title">顧客情報・懸念事項入力</div>

    <div class="customer-info">
      <div class="info-row">
        <div class="info-field">
          <label>顧客の年代</label>
          <select id="ageGroup">
            <option value="">選択してください</option>
            <option value="10s">10代</option>
            <option value="20s">20代</option>
            <option value="30s">30代</option>
            <option value="40s">40代</option>
            <option value="50s">50代</option>
            <option value="60s">60代</option>
            <option value="70s">70代以上</option>
          </select>
        </div>
        <div class="info-field">
          <label>性別</label>
          <select id="gender">
            <option value="">選択してください</option>
            <option value="male">男性</option>
            <option value="female">女性</option>
            <option value="other">その他・回答しない</option>
          </select>
        </div>
      </div>
      <div class="info-row">
        <div class="info-field">
          <label>相談内容</label>
          <select id="caseType">
            <option value="">選択してください</option>
            <option value="claim">請求（単独請求）</option>
            <option value="double_claim">Ｗ請求（不配＆不貞相手への請求）</option>
            <option value="chastity">貞操権侵害</option>
            <option value="defendant">被請求</option>
            <option value="divorce">離婚</option>
            <option value="childSupport">養育費</option>
          </select>
        </div>
        <div class="info-field">
          <label>相談経緯</label>
          <select id="channel">
            <option value="">選択してください</option>
            <option value="web">Web検索</option>
            <option value="webad">Web広告</option>
            <option value="cm">TV・CM</option>
            <option value="referral">知人紹介</option>
            <option value="other">その他</option>
          </select>
        </div>
      </div>
    </div>

    <div class="quick-tags">
      <div class="quick-tags-label">よくある懸念事項（クリックで追加）</div>
      <div class="tag-group">
        <button class="tag-btn" data-tag="費用が心配">費用が心配</button>
        <button class="tag-btn" data-tag="相手が払うか不安">相手が払うか不安</button>
        <button class="tag-btn" data-tag="証拠がない">証拠がない</button>
        <button class="tag-btn" data-tag="子どもへの影響">子どもへの影響</button>
        <button class="tag-btn" data-tag="相手と直接話したくない">相手と直接話したくない</button>
        <button class="tag-btn" data-tag="周囲にバレたくない">周囲にバレたくない</button>
        <button class="tag-btn" data-tag="慰謝料の相場が分からない">慰謝料の相場が分からない</button>
        <button class="tag-btn" data-tag="本当に取れるか不安">本当に取れるか不安</button>
        <button class="tag-btn" data-tag="減額したい（被請求）">減額したい（被請求）</button>
        <button class="tag-btn" data-tag="離婚すべきか迷っている">離婚すべきか迷っている</button>
        <button class="tag-btn" data-tag="再構築したい">再構築したい</button>
        <button class="tag-btn" data-tag="精神的に辛い">精神的に辛い</button>
      </div>
    </div>

    <div class="memo-area">
      <label for="memoInput">フリーメモ（顧客の懸念・発言を自由に入力）</label>
      <textarea id="memoInput" placeholder="例：相手が払ってくれるか不安、子どもへの影響が心配、離婚すべきか迷っている..."></textarea>
      <div class="char-count"><span id="charCount">0</span> 文字</div>
    </div>

    <div class="btn-row">
      <button class="generate-btn" onclick="generateScript()">トークスクリプトを生成</button>
      <button class="clear-btn" onclick="clearAll()">クリア</button>
    </div>
  </div>

  <!-- Right: Output Panel -->
  <div class="output-panel" id="outputPanel">
    <div class="empty-state" id="emptyState">
      <div class="icon">&#128172;</div>
      <h3>トークスクリプトを生成</h3>
      <p>左パネルで顧客の懸念事項を入力し、<br>「トークスクリプトを生成」ボタンを押してください。</p>
      <p style="margin-top: 16px; font-size: .78rem; color: #aab;">
        懸念タグのクリックやフリーメモへの入力で<br>最適なトークスクリプトがリアルタイムで表示されます。
      </p>
    </div>
    <div id="scriptOutput" style="display:none;"></div>
  </div>

</div>

<script>
const STRENGTHS = {
  freeCounseling: { label: '相談無料', text: '当事務所では相談料は無料です。' },
  noVisit: { label: '来所不要', text: '原則としてご来所は不要です。すべてお電話・WEB・郵送で完結いたします。' },
  expertTeam: { label: '不倫・離婚専門チーム', text: '不倫や離婚の専門チームが在籍しており、お客様の希望に可能な限り寄り添った交渉が可能です。' },
  lifeRestart: { label: '生活再スタート支援', text: 'お金を回収して終わりではなく、その後の生活の再スタートが切れるかどうかまで見守り、最後まで一緒に事件を進めてまいります。' },
};

const CONCERN_SCRIPTS = {

      {

      },
      {
        label: 'point',
        labelText: '補足ポイント',
        text: '不倫・離婚の<strong>専門チームがお客様のご希望額に寄り添った交渉</strong>を行いますので、費用対効果の面でもご納得いただける結果を目指します。まずは無料相談で、お客様のケースでの見通しをお伝えいたします。'
      },
      {
        label: 'close',
        labelText: 'クロージング',
        text: '費用のことはご心配いただかなくて大丈夫です。<strong>まずは無料相談で、どのような方法が最善か一緒に考えてみませんか？</strong>'
      }
    ],
    tip: '費用面の不安は最も多い懸念です。「相談無料」を繰り返し伝え、弁護士に依頼するメリットを具体的に説明しましょう。',
    strengths: ['freeCounseling', 'expertTeam']
  },

  payment: {
    keywords: ['払う', '支払い', '回収', '逃げ', '応じ'],
    title: '相手が払うか不安への対応',
    icon: '&#128179;',
    concern: 'お客様は相手方が支払いに応じるか不安を感じています。',
    scripts: [
      {
        label: 'response',

      },
      {
        label: 'close',
        labelText: 'クロージング',
        text: '<strong>まずは無料相談で、相手方への請求の見通しを具体的にお伝えいたします。</strong>一人で悩まず、専門家にお任せください。'
      }
    ],
    tip: '「専門チームが交渉のプロとして対応する」ことを伝え、一人で戦う必要がないことを強調しましょう。',

  },

  evidence: {
    keywords: ['証拠', '写真', 'LINE', 'メール', '録音', '記録', '証明'],
    title: '証拠がない場合の懸念への対応',
    icon: '&#128196;',
    concern: 'お客様は証拠がないことを心配しています。',

      {

      },
      {

      }
    ],
    tip: '「証拠がなくても相談できる」ことを伝え、具体的にどのようなものが証拠になるか例示すると安心感が増します。',

  },

  children: {
    keywords: ['子ども', '子供', '息子', '娘', '親権', '面会', '養育'],
    title: '子どもへの影響への懸念への対応',
    icon: '&#128118;',
    concern: 'お客様はお子様への影響を心配しています。',
    scripts: [
      {

// Tag button handling
document.querySelectorAll('.tag-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    this.classList.toggle('active');
    const textarea = document.getElementById('memoInput');
    const tag = this.dataset.tag;

    if (this.classList.contains('active')) {
      textarea.value = textarea.value ? textarea.value + '、' + tag : tag;
    } else {
      textarea.value = textarea.value
        .replace(new RegExp('[、,]?' + tag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[、,]?'), '')
        .replace(/^[、,]+|[、,]+$/g, '');
    }

    updateCharCount();
  });
});

// Character count
document.getElementById('memoInput').addEventListener('input', updateCharCount);
function updateCharCount() {
  document.getElementById('charCount').textContent = document.getElementById('memoInput').value.length;
}

// Script generation
function generateScript() {
  const memo = document.getElementById('memoInput').value;
  const caseType = document.getElementById('caseType').value;

  if (!memo.trim()) {
    alert('懸念事項を入力してください。タグのクリックまたはフリーメモへの入力をお願いします。');
    return;
  }

  const matchedConcerns = [];
  const memoLower = memo.toLowerCase();

  for (const [key, concern] of Object.entries(CONCERN_SCRIPTS)) {
    for (const keyword of concern.keywords) {
      if (memoLower.includes(keyword)) {
        matchedConcerns.push(concern);
        break;
      }
    }
  }

  if (matchedConcerns.length === 0) {
    matchedConcerns.push(CONCERN_SCRIPTS.cost);
    matchedConcerns.push(CONCERN_SCRIPTS.evidence);
    matchedConcerns.push(CONCERN_SCRIPTS.mentalPain);
  }

  renderScripts(matchedConcerns, caseType);
}

function renderScripts(concerns, caseType) {
  const output = document.getElementById('scriptOutput');
  const emptyState = document.getElementById('emptyState');

  emptyState.style.display = 'none';
  output.style.display = 'block';

  let html = '';

  // Opening
  html += renderSection(OPENING_SCRIPT, []);

  // Matched concern scripts
  concerns.forEach(concern => {
    html += renderSection(concern, concern.strengths || []);
  });

  // Case type supplement
  if (caseType) {
    const caseScript = getConditionSupplement(caseType);
    if (caseScript) {
      html += renderSection(caseScript, []);
    }
  }

  // Closing
  html += renderSection(CLOSING_SCRIPT, ['freeCounseling', 'expertTeam', 'noVisit', 'lifeRestart']);

  output.innerHTML = html;
}

function renderSection(section, strengthKeys) {
  let html = `
    <div class="script-section">
      <div class="script-section-title">
        <span class="icon">${section.icon}</span>
        ${section.title}
        <button class="copy-btn" onclick="copySection(this)">コピー</button>
      </div>
      <div class="script-card">`;

  if (section.concern) {
    html += `<div><span class="script-label label-concern">顧客の懸念</span></div>
             <div class="script-text">${section.concern}</div>
             <hr class="script-divider">`;
  }

  section.scripts.forEach((script, i) => {
    const labelClass = 'label-' + script.label;
    html += `<div><span class="script-label ${labelClass}">${script.labelText}</span></div>
             <div class="script-text">${script.text}</div>`;
    if (i < section.scripts.length - 1) {
      html += '<hr class="script-divider">';
    }
  });

  if (strengthKeys && strengthKeys.length > 0) {
    html += '<hr class="script-divider"><div>';
    strengthKeys.forEach(key => {
      const s = STRENGTHS[key];
      if (s) {
        html += `<span class="strength-badge">${s.label}</span>`;
      }
    });
    html += '</div>';
  }

  if (section.tip) {
    html += `<div class="tip-box">
               <div class="tip-box-title">対応のポイント</div>
               ${section.tip}
             </div>`;
  }

  html += '</div></div>';
  return html;
}

  return supplements[caseType] || null;
}

function clearAll() {
  document.getElementById('memoInput').value = '';
  document.getElementById('ageGroup').value = '';
  document.getElementById('gender').value = '';
  document.getElementById('caseType').value = '';
  document.getElementById('channel').value = '';

  document.querySelectorAll('.tag-btn.active').forEach(btn => {
    btn.classList.remove('active');
  });

  updateCharCount();

  document.getElementById('scriptOutput').style.display = 'none';
  document.getElementById('scriptOutput').innerHTML = '';
  document.getElementById('emptyState').style.display = '';
}

function copySection(btn) {
  const card = btn.closest('.script-section');
  const textElements = card.querySelectorAll('.script-text');
  let text = '';
  textElements.forEach(el => {
    text += el.textContent.trim() + '\n\n';
  });

  navigator.clipboard.writeText(text.trim()).then(() => {
    btn.textContent = 'コピー完了';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'コピー';
      btn.classList.remove('copied');
    }, 2000);
  });
}
</script>
